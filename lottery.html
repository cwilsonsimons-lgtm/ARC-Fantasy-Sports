<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Rumble Lottery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Single dark look on purpose: it matches the City Boys Dynasty app. */
:root{
  color-scheme:dark;
  --bg:#070A0F;--card:#111826;--card-2:#0E1420;
  --line:#1E2836;--line-soft:#161E2A;
  --ink:#F3F6FA;--ink-2:#93A0B0;--ink-3:#5E6B7C;
  --gold:#F2C14E;--gold-ink:#1A1405;
  --violet:#7C5CFF;
  --display:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:28px 16px 48px;min-height:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:.01em;
  text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.lede{color:var(--ink-2);max-width:62ch}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:860px){.grid{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}

/* ---- machine ---- */
.drum-wrap{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1/1.22}
#drum{width:100%;height:100%;display:block}
.reveal{min-height:96px;display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:14px;
  background:var(--card-2);border:1px solid var(--line-soft)}
.reveal .big{flex:none;font-family:var(--display);font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;min-width:2.4ch}
.reveal .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.reveal .team{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;text-transform:uppercase;overflow-wrap:anywhere}
.reveal .sub{color:var(--ink-2);font-size:13px}
.reveal.pop .big,.reveal.pop .team{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.reveal{--tc:var(--gold);transition:border-color .3s}
.reveal.sealed .big{color:var(--ink-3)}
.reveal.sealed .team{color:var(--ink)}
.reveal .sub b{color:var(--gold);font-weight:600}
.reveal .peek{margin-top:4px;padding:4px 10px;border-radius:8px;background:var(--bg);border:1px dashed var(--ink-3);
  font-weight:600;font-size:14px;align-self:flex-start;visibility:hidden}
.reveal .peek.show{visibility:visible}
.reveal.rattle{animation:rattle .12s linear infinite}
@keyframes rattle{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.reveal.pop{border-color:var(--tc);animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--tc),0 0 60px 10px var(--tc)}100%{box-shadow:0 0 0 0 transparent,0 0 0 0 transparent}}
.reveal.pop .team{animation:none}
.reveal .team .w{white-space:nowrap}
.reveal.pop .team .ch{display:inline-block;animation:drop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{transform:translateY(-60%) scale(1.4);opacity:0}to{transform:none;opacity:1}}
.btn.peekbtn{flex:0 0 auto;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.peekbtn.on{border-color:var(--gold);color:var(--gold)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:14px 18px;font-family:var(--display);font-weight:600;font-size:17px;
  letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--gold);color:var(--gold-ink);flex:1 1 200px}
.btn.primary:disabled{background:#3a3320;color:#8a7d55;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-size:14px;padding:12px 14px}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.ghost.armed{border-color:#F0453E;color:#F0453E}
.btn.ghost:disabled{opacity:.4;cursor:default}

/* ---- odds table ---- */
.odds{display:flex;flex-direction:column;gap:8px}
.orow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.orow:first-child{border-top:0}
.chip{width:12px;height:12px;border-radius:50%}
.oname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname small{color:var(--ink-3);font-weight:500;margin-left:6px}
.opct{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.pips{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.pip.on{background:currentColor}
.olabel{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* ---- entrant board ---- */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:420px){.board{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1/1.05;border-radius:10px;background:var(--card-2);border:1px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;
  font-variant-numeric:tabular-nums;min-width:0}
.tile .n{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;color:var(--ink-3)}
.tile .m{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.filled{border:1px solid transparent}
.tile.filled .n{color:inherit}
.tile.next{border:1.5px solid var(--gold)}
.tile.next .n{color:var(--gold)}
.tile.next::after{content:'NEXT';position:absolute;bottom:4px;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.board.pick .tile.filled{cursor:pointer}
.board.pick .tile.filled:hover{outline:2px solid var(--ink)}
.tile.winner{outline:3px solid var(--gold);outline-offset:1px}
.tile.winner::before{content:'★';position:absolute;top:2px;right:5px;font-size:11px;color:var(--gold)}
.tile.dim{opacity:.35}

/* ---- per-team holdings ---- */
.hold{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.hcard{border-radius:12px;padding:12px 14px;background:var(--card-2);border:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.hcard .hn{font-family:var(--display);font-weight:600;font-size:17px;text-transform:uppercase;line-height:1.1}
.hcard .hm{color:var(--ink-2);font-size:13px}
.hcard .nums{font-family:var(--mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hcard .nums.empty{color:var(--ink-3)}
.hcard.win{border-color:var(--gold)}

/* ---- result ---- */
.result{border-radius:16px;padding:18px;background:var(--gold);color:var(--gold-ink);display:flex;flex-direction:column;gap:4px}
.result .k{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.result .v{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.hint{color:var(--ink-2);font-size:14px}
.hint b{color:var(--gold);font-weight:600}

/* ---- setup ---- */
.srow{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr) 64px 52px;gap:10px;align-items:center}
.srow label{font-size:13px;color:var(--ink-2);font-weight:600}
select,input[type=number]{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%}
input[type=number]{font-family:var(--mono);text-align:center}
select:disabled,input:disabled{opacity:.55}
.shead{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr) 64px 52px;gap:10px;color:var(--ink-3);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.shead span:nth-child(n+3){text-align:center}
@media (max-width:480px){.srow,.shead{grid-template-columns:minmax(0,1fr) 56px 48px}.srow label,.shead span:first-child{grid-column:1/-1}
  .shead span:first-child{display:none}.srow label{margin-bottom:-4px}}
.logo{position:relative;width:48px;height:42px;border-radius:10px;border:1px dashed var(--line);background:var(--card-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--ink-3);font-weight:600;overflow:hidden}
.logo:hover,.logo:focus-within{border-color:var(--ink-3);color:var(--ink)}
.logo:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.logo img{width:100%;height:100%;object-fit:contain}
.logo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logo-x{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);
  font-size:11px;line-height:16px;z-index:1}
.reveal .rlogo{flex:none;width:56px;height:56px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid var(--tc)}
.dir{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.dir button{text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  display:flex;flex-direction:column;gap:2px}
.dir button b{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.dir button span{font-size:13px;color:var(--ink-2)}
.dir button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.dir button[aria-pressed="true"] b{color:var(--gold)}
.dir button:disabled{cursor:default}
.dir button:disabled[aria-pressed="false"]{opacity:.4}
.note{font-size:13px;color:var(--ink-3)}
.note.err{color:#F0453E}
.copyout{width:100%;min-height:120px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;
  font-family:var(--mono);font-size:12px;color:var(--ink);resize:vertical}

@media (prefers-reduced-motion:reduce){.reveal.pop,.reveal.pop .big,.reveal.pop .team .ch,.reveal.rattle{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">City Boys Dynasty · Draft lottery</div>
    <h1>Royal Rumble <em>Lottery</em></h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="panel" aria-label="Lottery setup">
    <h2>Setup</h2>
    <div class="dir" role="group" aria-label="Draw direction">
      <button type="button" id="dirDown" data-mode="down"><b>Start at #30</b><span>Draw #30 down to #1. The worst team gets the most balls.</span></button>
      <button type="button" id="dirUp" data-mode="up"><b>Start at #1</b><span>Draw #1 up to #30. The worst team gets the fewest balls.</span></button>
    </div>
    <div class="shead"><span>Finish</span><span>Team</span><span>Balls</span><span>Logo</span></div>
    <div id="setup" style="display:flex;flex-direction:column;gap:8px"></div>
    <p class="note" id="setupNote"></p>
    <div class="actions">
      <button class="btn ghost" id="restBtn" type="button">Draw the rest</button>
      <button class="btn ghost" id="copyBtn" type="button">Copy results</button>
      <button class="btn ghost" id="resetBtn" type="button">Reset lottery</button>
    </div>
    <textarea class="copyout" id="copyOut" readonly hidden></textarea>
  </section>

  <div class="grid">
    <section class="panel" aria-label="Ball machine">
      <div class="drum-wrap"><canvas id="drum" aria-hidden="true"></canvas></div>
      <div class="reveal" id="reveal" aria-live="polite"></div>
      <div class="actions">
        <button class="btn ghost peekbtn" id="peekBtn" type="button" hidden>Hold to peek</button>
        <button class="btn primary" id="drawBtn" type="button">Spin the cage</button>
      </div>
      <div class="odds">
        <div class="olabel"><span>Balls left</span><span id="oddsFor"></span></div>
        <div id="odds"></div>
      </div>
    </section>

    <div class="col">
      <section class="panel" aria-label="Entrant numbers">
        <h2>Rumble entrants</h2>
        <div id="resultBox"></div>
        <div class="board" id="board"></div>
      </section>

      <section class="panel" aria-label="Numbers by team">
        <h2>Numbers by team</h2>
        <div class="hold" id="hold"></div>
      </section>

    </div>
  </div>
</div>

<script>
// League teams, mirrored from js/data/teams.js (this page is standalone so it
// opens by double-clicking, without the app's module server).
const LEAGUE = [
  {id:'pandas',n:'UGF Pandas',mgr:'Wilson',c:'#8CE04A'},
  {id:'radiator',n:'Radiator Springs',mgr:'Benton',c:'#F0453E'},
  {id:'barzal',n:"Barzal's Balls",mgr:'Luke',c:'#5AA9E6'},
  {id:'dakyard',n:'Dakyard Football',mgr:'Jake',c:'#E6A85A'},
  {id:'boutte',n:'Diggin in Boutte',mgr:'Jatin',c:'#5AE6B5'},
  {id:'burrow',n:'Seriously Step Burrow',mgr:'Jarren',c:'#E65A7A'},
  {id:'saquon',n:'Saquon My Balls',mgr:'Cam',c:'#C77DFF'},
  {id:'brady',n:'Brady Bunch',mgr:'Manas',c:'#7D9BFF'},
  {id:'longhorns',n:'Texas Longhorns',mgr:'Mason',c:'#E6845A'},
  {id:'doghouse',n:"Mike Vick's Dog House",mgr:'Seabass',c:'#E6D15A'},
];
const BY_ID = Object.fromEntries(LEAGUE.map(t => [t.id, t]));
const PLACES = ['Last', '2nd to last', '3rd to last', '4th to last'];
const KEY = 'rumble_lottery_v1';

function defaults(){
  return {
    slots:[{team:'dakyard',balls:12},{team:'brady',balls:9},{team:'longhorns',balls:6},{team:'burrow',balls:3}],
    mode:'down',  // 'down': #30 to #1, 'up': #1 to #30
    draws:[],     // draws[k] = slot index that received numberOf(k)
    sealed:false, // last ball is out but the dealer hasn't revealed it
    logos:{},     // team id -> small data: URL, shown on the revealed ball
    winner:null,  // Rumble-winning entrant number
  };
}
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.slots) && Array.isArray(s.draws)){ s.mode = s.mode === 'up' ? 'up' : 'down'; s.sealed = !!s.sealed && s.draws.length > 0; s.logos = s.logos || {}; return s; } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const total = () => S.slots.reduce((a, s) => a + s.balls, 0);
const left = i => S.slots[i].balls - S.draws.filter(d => d === i).length;
const up = () => S.mode === 'up';
const remaining = () => total() - S.draws.length;
const numberOf = k => up() ? k + 1 : total() - k;   // number handed out by draw k
const drawOf = n => up() ? n - 1 : total() - n;     // inverse of numberOf
const nextNum = () => numberOf(S.draws.length);
const firstNum = () => numberOf(0), lastNum = () => numberOf(total() - 1);
const team = i => BY_ID[S.slots[i].team];
const numsFor = i => S.draws.map((d, k) => d === i ? numberOf(k) : null).filter(n => n !== null).sort((a, b) => a - b);
const holderOf = n => { const k = drawOf(n); return k >= 0 && k < S.draws.length ? S.draws[k] : null; };
function setupError(){
  const ids = S.slots.map(s => s.team);
  if(new Set(ids).size !== ids.length) return 'Each finish needs a different team.';
  if(S.slots.some(s => !(s.balls >= 1 && s.balls <= 30))) return 'Every team needs between 1 and 30 balls.';
  return '';
}

// Fair draw: one ball uniformly from every ball still in the machine.
function secureInt(n){
  const lim = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while(buf[0] >= lim);
  return buf[0] % n;
}
function pickSlot(){
  let r = secureInt(remaining());
  for(let i = 0; i < S.slots.length; i++){ r -= left(i); if(r < 0) return i; }
}

/* ---------------- bingo cage (visual only) ---------------- */
const cv = document.getElementById('drum'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1, drum = {x:0, y:0, r:0}, br = 12;
let balls = [], spinUntil = 0, busy = false;
let angle = 0, omega = 0;   // cage rotation and its speed (radians per frame)
let tray = null;            // the ball that came out: {slot, x0, y0, t0, sealed, revealT}
let sparks = [];

function size(){
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  drum = {x:W / 2, y:W / 2, r:W / 2 - 10};
  br = Math.max(8, drum.r * 0.085);
}
const trayPos = () => ({x:drum.x, y:H - br * 1.7 - 6, r:br * 1.7});
function fill(){
  balls = [];
  // Every ball in the cage looks the same (a grey ?), so the cage never shows which teams are left.
  for(let k = 0; k < remaining(); k++) balls.push(newBall(null));
  // a ball that is out of the cage but not yet revealed sits sealed in the tray
  const last = S.draws.length - 1;
  tray = last >= 0 && (S.sealed || tray) ? {slot:S.draws[last], t0:-1e9, sealed:!!S.sealed, revealT:S.sealed ? 0 : -1e9} : null;
}
function newBall(slot){
  const a = Math.random() * Math.PI * 2, d = Math.random() * (drum.r - br * 2);
  return {slot, x:drum.x + Math.cos(a) * d, y:drum.y + Math.sin(a) * d * .5 + drum.r * .3, vx:0, vy:0};
}
function step(now){
  const spinning = now < spinUntil;
  omega += ((spinning ? .09 : 0) - omega) * (spinning ? .05 : .03);
  angle += omega;
  for(const b of balls){
    const dx = b.x - drum.x, dy = b.y - drum.y, d = Math.hypot(dx, dy) || 1;
    b.vy += .18;                                                    // gravity
    if(omega > .01){                                                // the turning cage drags balls round and tosses them
      b.vx += -dy / d * omega * 3.2; b.vy += dx / d * omega * 3.2;
      b.vx += (Math.random() - .5) * omega * 14; b.vy += (Math.random() - .5) * omega * 14;
    }else if(Math.random() < .02){ b.vx += (Math.random() - .5) * .8; }
    b.vx *= .985; b.vy *= .985; b.x += b.vx; b.y += b.vy;
    const ex = b.x - drum.x, ey = b.y - drum.y, e = Math.hypot(ex, ey), lim = drum.r - br - 4;
    if(e > lim){
      const nx = ex / e, ny = ey / e; b.x = drum.x + nx * lim; b.y = drum.y + ny * lim;
      const dot = b.vx * nx + b.vy * ny; if(dot > 0){ b.vx -= 1.7 * dot * nx; b.vy -= 1.7 * dot * ny; }
    }
  }
  for(let i = 0; i < balls.length; i++) for(let j = i + 1; j < balls.length; j++){
    const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01, m = br * 2;
    if(d < m){
      const nx = dx / d, ny = dy / d, o = (m - d) / 2;
      a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if(rv < 0){ a.vx += rv * nx * .9; a.vy += rv * ny * .9; b.vx -= rv * nx * .9; b.vy -= rv * ny * .9; }
    }
  }
  sparks = sparks.filter(p => (p.life -= 1) > 0);
  for(const p of sparks){ p.vy += .12; p.vx *= .98; p.x += p.vx; p.y += p.vy; p.rot += p.vr; }
}
const logoImgs = {};
function logoImg(id){
  const src = S.logos[id]; if(!src) return null;
  let im = logoImgs[id];
  if(!im || im.src !== src){ im = logoImgs[id] = new Image(); im.src = src; }
  return im.complete && im.naturalWidth ? im : null;
}
function drawBall(x, y, r, slot, sx = 1){
  const sealed = slot == null, t = sealed ? null : team(slot), c = sealed ? '#A9B2BF' : t.c;
  ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(.02, sx), 1);
  const logo = sealed ? null : logoImg(t.id);
  if(logo){                                            // revealed ball with the team's logo on a white face
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.clip();
    const k = Math.min(r * 1.5 / logo.naturalWidth, r * 1.5 / logo.naturalHeight), w = logo.naturalWidth * k, h = logo.naturalHeight * k;
    ctx.drawImage(logo, -w / 2, -h / 2, w, h); ctx.restore();
    ctx.strokeStyle = c; ctx.lineWidth = r * .2; ctx.beginPath(); ctx.arc(0, 0, r - r * .1, 0, Math.PI * 2); ctx.stroke();
    ctx.restore(); return;
  }
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, c); g.addColorStop(1, shade(c, sealed ? -.3 : -.35));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0B0F16'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(r * .95)}px Oswald, 'Arial Narrow', sans-serif`;
  ctx.fillText(sealed ? '?' : t.n[0], 0, r * .06);
  ctx.restore();
}
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(v * (1 + f)));
  return `rgb(${c.join(',')})`;
}
function drawCage(){
  const {x, y, r} = drum;
  // stand + crank
  ctx.strokeStyle = '#2A3648'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .55, y + r * .95); ctx.lineTo(x, y); ctx.lineTo(x + r * .55, y + r * .95); ctx.stroke();
  // glass-ish interior
  const g = ctx.createRadialGradient(x - r * .3, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(255,255,255,.012)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function drawWires(){
  const {x, y, r} = drum;
  // the cage's wire hoops, seen side-on: ellipses that turn with the cage
  ctx.lineWidth = 1.5;
  for(let k = 0; k < 6; k++){
    const a = angle + k * Math.PI / 6, w = Math.abs(Math.cos(a)) * r;
    ctx.strokeStyle = `rgba(147,160,176,${.10 + .22 * Math.max(0, Math.sin(a))})`;
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, w), r, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = '#3A475B'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  // hub and crank handle
  const hx = x + Math.cos(angle * 1.5) * r * .22, hy = y + Math.sin(angle * 1.5) * r * .22;
  ctx.strokeStyle = '#93A0B0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = '#F2C14E'; ctx.beginPath(); ctx.arc(hx, hy, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#93A0B0'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  // glint
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, r - 12, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
}
function render(now){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const tp = trayPos();
  // chute and tray cup
  ctx.fillStyle = '#0B111B'; ctx.strokeStyle = '#2A3648'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(tp.x - tp.r - 8, drum.y + drum.r - 6, (tp.r + 8) * 2, H - (drum.y + drum.r) + 4, [0, 0, 16, 16]);
  ctx.fill(); ctx.stroke();
  drawCage();
  for(const b of balls) drawBall(b.x, b.y, br, null);
  drawWires();
  if(!balls.length && !tray){
    ctx.fillStyle = '#5E6B7C'; ctx.font = `600 ${Math.round(drum.r * .12)}px Oswald, 'Arial Narrow', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CAGE EMPTY', drum.x, drum.y);
  }
  if(tray){
    // drop from the cage into the tray
    const p = Math.min(1, (now - tray.t0) / 600), e = 1 - Math.pow(1 - p, 3);
    const x0 = tray.x0 ?? tp.x, y0 = tray.y0 ?? tp.y;
    let x = x0 + (tp.x - x0) * e, y = y0 + (tp.y - y0) * e, r = br + (tp.r - br) * e, sx = 1;
    let face = tray.sealed ? null : tray.slot;
    if(tray.revealT > 0){
      // reveal: rattle, then flip to the team's colour
      const q = now - tray.revealT;
      if(q < SHAKE){ const amp = 1 + q / SHAKE * 4; x += Math.sin(q / 28) * amp; y += Math.cos(q / 41) * amp * .6; face = null; }
      else if(q < SHAKE + FLIP){ const f = (q - SHAKE) / FLIP; sx = Math.abs(Math.cos(f * Math.PI)); face = f < .5 ? null : tray.slot; r *= 1 + .25 * Math.sin(f * Math.PI); }
    }
    if(tray.sealed && tray.revealT === 0 && p >= 1){          // sealed and waiting: a slow shimmer
      ctx.fillStyle = `rgba(242,193,78,${.10 + .08 * Math.sin(now / 300)})`;
      ctx.beginPath(); ctx.arc(x, y, r + 7, 0, Math.PI * 2); ctx.fill();
    }
    drawBall(x, y, r, face, sx);
  }
  for(const p of sparks){
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
  }
}
function burst(slot){
  const tp = trayPos(), c = team(slot).c;
  for(let i = 0; i < 70; i++){
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3, v = 3 + Math.random() * 6;
    sparks.push({x:tp.x, y:tp.y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:50 + Math.random() * 40,
      c:Math.random() < .7 ? c : '#F2C14E', s:4 + Math.random() * 5, rot:Math.random() * 6, vr:(Math.random() - .5) * .4});
  }
}
function loop(now){ step(now); render(now); requestAnimationFrame(loop); }

/* ---------------- draw flow ---------------- */
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SHAKE = reduce ? 0 : 1300, FLIP = reduce ? 0 : 420;

// 1. Spin the cage and drop one ball, sealed. Nobody sees the team yet.
async function spin(){
  if(busy || S.sealed || remaining() < 1 || setupError()) return;
  busy = true; tray = null;
  const slot = pickSlot();
  S.draws.push(slot); S.sealed = true; save();      // committed before the show, so a reload can't re-roll it
  renderAll();
  const el = $('reveal'); el.className = 'reveal sealed';
  el.innerHTML = `<span class="big">#${nextNum() - (up() ? 1 : -1)}</span><div class="who"><span class="team">Spinning…</span><span class="sub">One ball is about to drop.</span></div>`;
  if(!reduce){ spinUntil = performance.now() + 1700; await wait(2100); }
  const b = balls.splice(Math.floor(Math.random() * balls.length), 1)[0] || {x:drum.x, y:drum.y};
  tray = {slot, x0:b.x, y0:b.y, t0:performance.now(), sealed:true, revealT:0};
  await wait(reduce ? 0 : 650);
  busy = false; renderAll();
}
// 2. The dealer reveals it to the room.
async function reveal(){
  if(busy || !S.sealed || !tray) return;
  busy = true; renderAll();
  const k = S.draws.length - 1, slot = S.draws[k];
  tray.revealT = performance.now();
  $('reveal').classList.add('rattle');
  await wait(SHAKE + FLIP / 2);
  tray.sealed = false; S.sealed = false; save();
  $('reveal').classList.remove('rattle');
  if(!reduce) burst(slot);
  showReveal(numberOf(k), slot, true);
  busy = false; renderAll({keepReveal:true});
}
function showReveal(num, slot, pop){
  const el = $('reveal');
  el.className = 'reveal';
  if(num == null){
    el.style.removeProperty('--tc');
    el.innerHTML = `<div class="who"><span class="team" style="color:var(--ink-2)">Ready</span><span class="sub">Every team has all ${remaining()} balls in. The first ball out gets entry #${nextNum()}.</span></div>`;
    return;
  }
  if(slot == null){                                  // sealed ball waiting in the tray
    const t = team(S.draws[S.draws.length - 1]);
    el.classList.add('sealed');
    el.innerHTML = `<span class="big">#${num}</span>
      <div class="who"><span class="team">Ball is out</span>
      <span class="sub">Dealer: hold <b>Peek</b> to check it, then tap <b>Reveal</b>.</span>
      <span class="peek" id="peekOut">${esc(t.n)} (${esc(t.mgr)})</span></div>`;
    return;
  }
  const t = team(slot);
  el.style.setProperty('--tc', t.c);
  if(pop) el.classList.add('pop');
  const letters = pop && !reduce
    ? (() => { let i = 0; return t.n.split(' ').map(w => `<span class="w">${[...w].map(ch =>
        `<span class="ch" style="animation-delay:${i++ * 35}ms">${esc(ch)}</span>`).join('')}</span>`).join(' '); })()
    : esc(t.n);
  el.innerHTML = `<span class="big" style="color:${t.c}">#${num}</span>
    ${S.logos[t.id] ? `<img class="rlogo" src="${S.logos[t.id]}" alt="">` : ''}
    <div class="who"><span class="team" style="color:${t.c}" aria-label="${esc(t.n)}">${letters}</span>
    <span class="sub">${esc(t.mgr)} gets entry #${num} · ${left(slot)} ball${left(slot) === 1 ? '' : 's'} left</span></div>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderAll(opt = {}){
  const hide = S.sealed ? S.draws.length - 1 : -1;       // a sealed ball stays secret everywhere until revealed
  const drawn = S.draws.length - (hide >= 0 ? 1 : 0), rem = total() - drawn;
  const n = numberOf(drawn), done = rem < 1, err = setupError();   // n = number on the line

  const db = $('drawBtn');
  db.textContent = S.sealed ? (busy ? (tray && tray.revealT ? 'Revealing…' : `Spinning for #${n}…`) : `Reveal #${n}`)
    : done ? 'All numbers drawn' : `Spin for #${n}`;
  db.disabled = busy || (!S.sealed && (done || !!err));
  $('peekBtn').hidden = !S.sealed || busy;
  $('oddsFor').textContent = done ? 'Done' : `Chance at #${n}`;

  // odds + pips
  $('odds').innerHTML = S.slots.map((s, i) => {
    const t = team(i), l = left(i) + (i === S.draws[hide] ? 1 : 0), pool = rem;
    const pct = pool > 0 ? (l / pool * 100).toFixed(1) + '%' : '—';
    const pips = Array.from({length:s.balls}, (_, k) => `<span class="pip${k < l ? ' on' : ''}"></span>`).join('');
    return `<div class="orow"><span class="chip" style="background:${t.c}"></span>
      <span class="oname">${esc(t.n)}<small>${PLACES[i]}</small></span><span class="opct">${pct}</span>
      <span class="pips" style="color:${t.c}" aria-label="${l} of ${s.balls} balls left">${pips}</span></div>`;
  }).join('');

  // entrant board
  const T = total(), pick = done && !busy && !S.sealed;
  $('board').className = 'board' + (pick ? ' pick' : '');
  let tiles = '';
  for(let num = 1; num <= T; num++){
    const k = drawOf(num), has = k < S.draws.length && k !== hide, slot = has ? S.draws[k] : null;
    const next = !done && num === n;
    if(has){
      const t = team(slot), win = S.winner === num;
      tiles += `<button type="button" class="tile filled${win ? ' winner' : ''}${S.winner && !win ? ' dim' : ''}" data-n="${num}"
        style="background:${t.c}22;color:${t.c}" ${pick ? '' : 'tabindex="-1"'} aria-label="Entrant ${num}: ${esc(t.n)}">
        <span class="n">${num}</span><span class="m">${esc(t.mgr)}</span></button>`;
    }else{
      tiles += `<div class="tile${next ? ' next' : ''}"><span class="n">${num}</span></div>`;
    }
  }
  $('board').innerHTML = tiles;

  // result
  if(S.winner && holderOf(S.winner) !== null){
    const t = team(holderOf(S.winner));
    $('resultBox').innerHTML = `<div class="result"><span class="k">Rumble winner: entrant #${S.winner}</span>
      <span class="v">${esc(t.n)} gets the 1st pick</span><span>${esc(t.mgr)} held #${S.winner}. Tap a different number to change it.</span></div>`;
  }else if(pick){
    $('resultBox').innerHTML = `<p class="hint">Every number is out. After the Royal Rumble, <b>tap the winner's entrant number</b> to see who gets the 1st pick.</p>`;
  }else{
    $('resultBox').innerHTML = `<p class="hint">Entry numbers go from #${firstNum()} ${up() ? 'up' : 'down'} to #${lastNum()}. Each ball drawn fills in the next one.</p>`;
  }

  // holdings
  $('hold').innerHTML = S.slots.map((s, i) => {
    const t = team(i), nums = numsFor(i).filter(x => hide < 0 || x !== numberOf(hide));
    const win = S.winner && holderOf(S.winner) === i;
    return `<div class="hcard${win ? ' win' : ''}"><span class="hn" style="color:${t.c}">${esc(t.n)}</span>
      <span class="hm">${esc(t.mgr)} · ${PLACES[i]} · ${nums.length} of ${s.balls} numbers · ${(s.balls / T * 100).toFixed(0)}% of the field</span>
      <span class="nums${nums.length ? '' : ' empty'}">${nums.length ? nums.map(x => '#' + x).join('  ') : 'No numbers yet'}</span></div>`;
  }).join('');

  // setup
  const locked = S.draws.length > 0;
  $('setup').innerHTML = S.slots.map((s, i) => `<div class="srow">
      <label for="team${i}">${PLACES[i]}</label>
      <select id="team${i}" data-i="${i}" ${locked ? 'disabled' : ''}>${LEAGUE.map(t =>
        `<option value="${t.id}"${t.id === s.team ? ' selected' : ''}>${esc(t.n)} (${esc(t.mgr)})</option>`).join('')}</select>
      <input id="balls${i}" data-i="${i}" type="number" min="1" max="30" value="${s.balls}" aria-label="${PLACES[i]} balls" ${locked ? 'disabled' : ''}>
      <span class="logo">${S.logos[s.team] ? `<img src="${S.logos[s.team]}" alt=""><button type="button" class="logo-x" data-clear="${s.team}" aria-label="Remove ${esc(team(i).n)} logo">×</button>` : '+'}
        <input id="logo${i}" data-i="${i}" type="file" accept="image/*" aria-label="${esc(team(i).n)} logo"></span>
    </div>`).join('');
  const note = $('setupNote');
  note.className = 'note' + (err ? ' err' : '');
  note.textContent = err || (locked
    ? 'Setup is locked once the first ball is drawn. Reset the lottery to change it.'
    : `${T} balls in the machine, one per entry number from #${firstNum()} ${up() ? 'up' : 'down'} to #${lastNum()}.`);
  for(const b of document.querySelectorAll('.dir button')){
    b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)); b.disabled = locked;
  }
  $('lede').textContent = up()
    ? `Every ball in the machine is a team. Start at entry #1 with every team holding all their balls, draw one, and that team gets #1 and loses a ball. Then draw for #2, #3, and so on up to #${T}. The worst team has the fewest balls, so it is least likely to get stuck with an early number. Whoever holds the Rumble winner's number gets the 1st pick.`
    : `Every ball in the machine is a team. Start at entry #${T} with every team holding all their balls, draw one, and that team gets #${T} and loses a ball. Then draw for #${T - 1}, #${T - 2}, and so on down to #1. Whoever holds the Rumble winner's number gets the 1st pick.`;
  $('restBtn').disabled = done || busy || S.sealed || !!err;
  if(!busy && !opt.keepReveal){
    const last = S.draws.length - 1;
    if(last < 0) showReveal(null);
    else showReveal(numberOf(last), S.sealed ? null : S.draws[last], false);
  }
}

/* ---------------- events ---------------- */
$('drawBtn').addEventListener('click', () => S.sealed ? reveal() : spin());
// Peek: shows the team only while the dealer holds the button down.
const peek = on => { const o = $('peekOut'); if(o) o.classList.toggle('show', on); $('peekBtn').classList.toggle('on', on); };
$('peekBtn').addEventListener('pointerdown', e => { e.preventDefault(); try{ e.target.setPointerCapture(e.pointerId); }catch(_){} peek(true); });
for(const ev of ['pointerup', 'pointerleave', 'pointercancel', 'blur']) $('peekBtn').addEventListener(ev, () => peek(false));
$('peekBtn').addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); peek(true); } });
$('peekBtn').addEventListener('keyup', () => peek(false));
$('peekBtn').addEventListener('contextmenu', e => e.preventDefault());
document.querySelector('.dir').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled || S.draws.length || b.dataset.mode === S.mode) return;
  // Flip the ball counts too, so the worst team goes from most balls to fewest (12/9/6/3 <-> 3/6/9/12).
  const counts = S.slots.map(s => s.balls).reverse();
  S.slots.forEach((s, i) => s.balls = counts[i]);
  S.mode = b.dataset.mode; save(); fill(); renderAll();
});
$('board').addEventListener('click', e => {
  const t = e.target.closest('.tile.filled'); if(!t || remaining() > 0 || busy || S.sealed) return;
  const n = +t.dataset.n; S.winner = S.winner === n ? null : n; save(); renderAll({keepReveal:true});
});
$('setup').addEventListener('change', e => {
  const i = +e.target.dataset.i; if(isNaN(i)) return;
  if(e.target.type === 'file'){ const f = e.target.files[0]; if(f) addLogo(S.slots[i].team, f); return; }   // logos can change any time
  if(S.draws.length) return;
  if(e.target.tagName === 'SELECT') S.slots[i].team = e.target.value;
  else S.slots[i].balls = Math.max(0, Math.round(+e.target.value || 0));
  save(); fill(); renderAll();
});
$('setup').addEventListener('click', e => {
  const x = e.target.closest('[data-clear]'); if(!x) return;
  e.preventDefault(); delete S.logos[x.dataset.clear]; save(); renderAll({keepReveal:true});
});
// Shrink an uploaded logo to 160px so a handful of them fit comfortably in browser storage.
function addLogo(id, file){
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 160 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    S.logos[id] = c.toDataURL('image/png'); save(); renderAll({keepReveal:true});
  };
  im.onerror = () => { URL.revokeObjectURL(url); $('setupNote').className = 'note err'; $('setupNote').textContent = 'That file isn\'t an image this browser can open. Try a PNG or JPG.'; };
  im.src = url;
}
function armed(btn, label, action){
  let t = 0;
  btn.addEventListener('click', () => {
    if(btn.disabled) return;
    if(btn.classList.contains('armed')){ clearTimeout(t); btn.classList.remove('armed'); btn.textContent = label; action(); return; }
    btn.classList.add('armed'); btn.textContent = 'Tap again to confirm';
    t = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = label; }, 3000);
  });
}
armed($('restBtn'), 'Draw the rest', () => {
  if(busy) return;
  while(remaining() > 0) S.draws.push(pickSlot());
  save(); tray = null; fill(); renderAll();
});
armed($('resetBtn'), 'Reset lottery', () => {
  if(busy) return;
  S = {...defaults(), slots:S.slots, mode:S.mode, logos:S.logos}; save(); tray = null; sparks = []; $('copyOut').hidden = true; fill(); renderAll();
});
$('copyBtn').addEventListener('click', () => {
  const lines = [`ROYAL RUMBLE LOTTERY (#${firstNum()} to #${lastNum()})`];
  S.slots.forEach((s, i) => {
    const t = team(i), nums = numsFor(i);
    lines.push(`${t.n} (${t.mgr}), ${PLACES[i].toLowerCase()}: ${nums.length ? nums.map(x => '#' + x).join(', ') : 'none yet'}`);
  });
  if(S.winner && holderOf(S.winner) !== null) lines.push('', `Rumble winner #${S.winner}: ${team(holderOf(S.winner)).n} gets the 1st pick`);
  const text = lines.join('\n'), out = $('copyOut'), btn = $('copyBtn');
  out.value = text;
  const ok = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy results', 1500); };
  const fallback = () => { out.hidden = false; out.focus(); out.select(); btn.textContent = 'Select and copy below'; };
  try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
});
new ResizeObserver(() => {
  size(); if(busy) return;             // mid-spin the ball about to drop is still in the cage; refill after
  const t = tray; fill(); if(t && tray) tray = {...t, x0:undefined, y0:undefined};
}).observe(cv);

size(); fill(); renderAll(); requestAnimationFrame(loop);
</script>
</body>
</html>
