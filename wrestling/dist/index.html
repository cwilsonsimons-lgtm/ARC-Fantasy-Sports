<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestling GM</title>
<link rel="icon" href="data:,">
<style>
/* css/app.css */
/* Wrestling GM shell.
   Tool-first, not document-first: dense rows, tabular numbers, one accent.
   Palette matches the design foundation page - cool slate ground, brass accent
   for anything live or on-air, oxblood for cuts, losses and grievances. */

:root{
  --ground:#E8EAE7; --surface:#F3F4F1; --sunk:#DDE0DC;
  --ink:#15181A; --soft:#4C5457; --faint:#6E777A;
  --brass:#9C6511; --brass-wash:#EDE3D2;
  --grease:#8E2226; --grease-wash:#EFDDDC;
  --rule:#C7CBC6; --rule-soft:#D7DAD6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14171A; --surface:#1B1F22; --sunk:#101315;
    --ink:#E7E9E6; --soft:#A3ACAF; --faint:#7E878A;
    --brass:#E2A54A; --brass-wash:#241C0F;
    --grease:#E07A80; --grease-wash:#241516;
    --rule:#2F353A; --rule-soft:#242A2E;
  }
}
:root[data-theme="dark"]{
  --ground:#14171A; --surface:#1B1F22; --sunk:#101315;
  --ink:#E7E9E6; --soft:#A3ACAF; --faint:#7E878A;
  --brass:#E2A54A; --brass-wash:#241C0F;
  --grease:#E07A80; --grease-wash:#241516;
  --rule:#2F353A; --rule-soft:#242A2E;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
#app{display:flex;flex-direction:column;min-height:100%}

/* ---------- top bar ---------- */
.topbar{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:.5rem 1rem;padding:.7rem 16px .55rem;
  border-bottom:2px solid var(--ink);background:var(--surface);
  position:sticky;top:0;z-index:5;
}
.brand{display:flex;flex-direction:column;min-width:0}
.brand-name{font-weight:700;letter-spacing:-.01em}
.brand-sub{font:400 11px/1.4 var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.when{font:400 11px/1.4 var(--mono);color:var(--brass);text-align:right;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tabs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.15rem;margin-top:.35rem}
.tab{
  font:400 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  padding:.45rem .6rem;border:0;background:none;color:var(--faint);
  cursor:pointer;border-bottom:2px solid transparent;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brass);border-bottom-color:var(--brass)}

/* ---------- screen ---------- */
.screen{flex:1;padding:1.1rem 16px 4rem;max-width:72rem;width:100%;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 .15rem;letter-spacing:-.01em}
h2{font:700 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:1.6rem 0 .5rem}
.sub{font:400 11px/1.5 var(--mono);color:var(--faint);letter-spacing:.05em;margin:0 0 1rem}
p{margin:0 0 .7rem}
a{color:var(--brass)}

/* ---------- tables ---------- */
.scroller{overflow-x:auto;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:30rem}
th{
  font:700 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;border-bottom:1px solid var(--ink);
  padding:.35rem .6rem .35rem 0;white-space:nowrap;
}
td{border-bottom:1px solid var(--rule-soft);padding:.45rem .6rem .45rem 0;vertical-align:top}
th:last-child,td:last-child{padding-right:0}
tbody tr:hover{background:var(--surface)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--brass)}
.neg{color:var(--grease)}
.muted{color:var(--faint)}

/* ---------- controls ---------- */
.bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:1rem}
button.act,select,input{
  font:400 12px/1 var(--mono);color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);padding:.5rem .7rem;cursor:pointer;
}
input,select{cursor:auto}
button.act:hover{border-color:var(--brass);color:var(--brass)}
button.act.primary{background:var(--brass-wash);border-color:var(--brass);color:var(--brass);font-weight:700}
button.act.danger:hover{border-color:var(--grease);color:var(--grease)}
button.act:disabled{opacity:.45;cursor:not-allowed}
label{font:400 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:.2rem}
.field{display:flex;flex-direction:column;min-width:8rem}

/* ---------- cards and layers ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--rule);padding:.8rem .9rem}
.card h3{font:700 10px/1.4 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--brass);margin:0 0 .5rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0;border-bottom:1px solid var(--rule-soft);font-size:12px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--faint)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

.meter{height:4px;background:var(--sunk);margin-top:.25rem;position:relative;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.meter i.low{background:var(--grease)}

.pill{
  display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;padding:.25rem .4rem;border:1px solid var(--rule);color:var(--faint);
}
.pill.brass{color:var(--brass);border-color:var(--brass);background:var(--brass-wash)}
.pill.grease{color:var(--grease);border-color:var(--grease);background:var(--grease-wash)}

.empty{color:var(--faint);font-style:italic;padding:1.2rem 0}
.rowlink{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.rowlink:hover{color:var(--brass)}

/* ---------- log ---------- */
.log{font-family:var(--mono);font-size:11.5px}
.log .ev{display:grid;grid-template-columns:4.2rem 9.5rem 1fr;gap:.6rem;padding:.35rem 0;border-bottom:1px solid var(--rule-soft)}
.log .ev .d{color:var(--faint)}
.log .ev .t{color:var(--brass);overflow-wrap:anywhere}
@media (max-width:40rem){
  .log .ev{grid-template-columns:1fr;gap:.1rem}
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(1rem);
  background:var(--ink);color:var(--ground);font:400 12px/1 var(--mono);
  padding:.6rem .9rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- match playback ---------- */
.playback{
  border:1px solid var(--rule);
  border-left:3px solid var(--brass);
  background:var(--surface);
  padding:.9rem 1rem;
  margin-bottom:1.2rem;
}
.playback.done{border-left-color:var(--ink)}
.pb-head{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.6rem;font-size:13px}
.pb-clock{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:2.6rem;line-height:1;letter-spacing:-.02em;
}
.pb-bar{height:6px;margin:.5rem 0 .7rem}
.pb-result{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.2rem;margin-bottom:.6rem}
.pb-outcome{font-size:1.05rem;font-weight:600}
.pb-feed{min-height:5.6rem}
.pb-feed .ev{grid-template-columns:3.4rem 1fr;padding:.22rem 0;border-bottom:0}
.pb-feed .ev.fin span:last-child{color:var(--brass);font-weight:700}
.pb-controls{margin:0}
@media (max-width:40rem){
  .pb-feed .ev{grid-template-columns:3.2rem 1fr}
  .pb-clock{font-size:2.1rem}
}

</style>
</head>

          return `<tr>
          <td class="num muted">${title.lineage.length - i}</td>
          <td>${r.wrestlerIds.map((id) => `<button class="rowlink" data-action="go" data-arg="wrestler/${id}">${esc(nameOf(id))}</button>`).join(" &amp; ")}
            ${r.lostOnDay == null ? ' <span class="pill brass">current</span>' : ""}</td>
          <td class="num">${formatDate(cal, r.wonOnDay)}</td>
          <td class="num">${r.lostOnDay == null ? '<span class="muted">-</span>' : formatDate(cal, r.lostOnDay)}</td>
          <td class="num">${length}d</td>
          <td class="num">${r.defenses}</td>
          <td>${r.wonFromIds.length ? esc(r.wonFromIds.map(nameOf).join(" & ")) : '<span class="muted">vacant</span>'}</td>
        </tr>`;
        }).join("") || '<tr><td colspan="7" class="empty">Never defended.</td></tr>';
        const titleMatches = queryLog({ type: EVENT_TYPES.MATCH_RESULT }).filter((e) => e.data.titleId === title.id).slice(-6).reverse().map((e) => `<div class="ev"><span class="d">d${e.day}</span><span>${esc(e.summary)}</span></div>`).join("") || '<p class="empty">No title matches yet.</p>';
        return `
        <h2>${esc(title.name)}</h2>
        <div class="cards">
          <div class="card"><h3>Champion</h3>
            ${isVacant(title) ? '<p class="neg" style="margin:0">Vacant.</p>' : `<div class="pb-outcome">${holders.map((id) => `<button class="rowlink" data-action="go" data-arg="wrestler/${id}"><strong>${esc(nameOf(id))}</strong></button>`).join(" &amp; ")}</div>
                 <div class="kv"><span>Held for</span><span>${days} days</span></div>
                 <div class="kv"><span>Defences</span><span>${reign.defenses}</span></div>
                 <div class="kv"><span>Won it</span><span>${formatDate(cal, reign.wonOnDay)}</span></div>`}
          </div>
          <div class="card"><h3>#1 contender</h3>
            ${contender ? `<div class="pb-outcome"><button class="rowlink" data-action="go" data-arg="wrestler/${contender.id}"><strong>${esc(contender.name)}</strong></button></div>
                 <div class="kv"><span>Ranked</span><span>#${contender.standing.rank}</span></div>
                 <div class="kv"><span>Record</span><span>${contender.standing.wins}-${contender.standing.losses}</span></div>
                 <div class="kv"><span>Streak</span><span>${contender.standing.streak.type || "-"}${contender.standing.streak.count || ""}</span></div>` : '<p class="empty" style="padding:0">Nobody ranked yet.</p>'}
            <div class="kv"><span class="muted" style="font-size:11px">Highest ranked wrestler who is not the champion. You can book past them, and they will notice.</span><span></span></div>
          </div>
          <div class="card"><h3>Recent title matches</h3>
            <div class="log">${titleMatches}</div>
          </div>
        </div>

        <h3 style="margin-top:1rem">Lineage</h3>
        <div class="scroller"><table>
          <thead><tr><th>#</th><th>Champion</th><th>Won</th><th>Lost</th><th>Days</th><th>Def.</th><th>Beat</th></tr></thead>
          <tbody>${lineage}</tbody>
        </table></div>`;
      }).join("");
      const table2 = table().slice(0, 10).map((w) => {
        const belts = titlesHeldBy(w.id);
        return `<tr>
        <td class="num ${w.standing.rank <= 3 ? "pos" : ""}">#${w.standing.rank}</td>
        <td><button class="rowlink" data-action="go" data-arg="wrestler/${w.id}">${esc(w.name)}</button>
          ${belts.map((b) => `<span class="pill brass">${esc(b.shortName)}</span>`).join("")}</td>
        <td class="num">${w.standing.wins}-${w.standing.losses}${w.standing.draws ? `-${w.standing.draws}` : ""}</td>
        <td class="num ${w.standing.streak.type === "W" ? "pos" : w.standing.streak.type === "L" ? "neg" : "muted"}">${w.standing.streak.type || "-"}${w.standing.streak.count || ""}</td>
        <td class="num">${w.standing.rankPoints.toFixed(1)}</td>
      </tr>`;
      }).join("");
      return `
      <h1>Championships</h1>
      <p class="sub">Rankings are computed from the record after every match. Wrestlers know their number.</p>
      ${blocks}

      <h2>Top ten</h2>
      <div class="scroller"><table>
        <thead><tr><th>Rank</th><th>Wrestler</th><th>Record</th><th>Streak</th><th>Points</th></tr></thead>
        <tbody>${table2}</tbody>
      </table></div>`;
    }
  };

  // wrestling/js/main.js
  registerScreen("roster", roster_default);
  registerScreen("show", show_default);
  registerScreen("titles", titles_default);
  registerScreen("calendar", calendar_default);
  registerScreen("log", log_default);
  registerScreen("saves", saves_default);
  registerScreen("wrestler", wrestler_default);
  setWhenFormatter((state2) => `${formatDate(state2.calendar)} \xB7 ${formatGameTime(state2.calendar.day)}`);
  function refresh2(message) {
    renderHeader(isLoaded() ? getState() : null);
    render();
    if (message) toast(message);
  }
  registerActions({
    // --- lifecycle ---------------------------------------------------------
    newGame(_data, form) {
      const f = new FormData(form);
      newGame({
        seed: (f.get("seed") || "").trim() || `seed-${Date.now()}`,
        gmName: f.get("gmName") || "New GM",
        brandName: f.get("brandName") || "Weekly Showcase",
        mode: f.get("mode") || "sandbox",
        scheduleBlocks: 3
      });
      const keys = seedRoster();
      seedTitles(store_exports, keys);
      refresh();
      go("show");
      refresh2("New game started with 14 wrestlers and three months booked");
    },
    saveSlot() {
      const slot = document.getElementById("slotName")?.value.trim() || "slot1";
      const label = document.getElementById("slotLabel")?.value.trim() || "";
      const result = save(slot, { label });
      refresh2(result.ok ? `Saved to ${slot}` : `Save failed: ${result.error}`);
    },
    loadSlot({ slot }) {
      const result = load(slot);
      if (!result.ok) return toast(`Load failed: ${result.error}`);
      go("roster");
      refresh2(`Loaded ${slot}`);
    },
    deleteSlot({ slot }) {
      deleteSave(slot);
      refresh2(`Deleted ${slot}`);
    },
    async exportSave() {
      const json = toJSON({ label: "export" });
      try {
        await navigator.clipboard.writeText(json);
        toast(`Copied ${(json.length / 1024).toFixed(0)} KB to the clipboard`);
      } catch {
        window.prompt("Copy this save:", json);
      }
    },
    importSave() {
      const text = window.prompt("Paste a save:");
      if (!text) return;
      try {
        fromJSON(text);
        go("roster");
        refresh2("Save imported");
      } catch (err) {
        toast(err.message);
      }
    },
    checkState() {
      const problems = checkState(getState());
      refresh2(problems.length ? `${problems.length} integrity problem(s)` : "State is sound");
    },
    // --- calendar ----------------------------------------------------------
    advance({ days }) {
      const { to } = advanceDays(Number(days) || 1);
      refresh2(`Now day ${to}`);
    },
    advanceToShow() {
      const moved = advanceToNextShow();
      if (!moved) return toast("Nothing left on the calendar");
      const entry = getState().calendar.entries.find((e) => e.day === moved.to);
      refresh2(entry ? `${entry.label} is today` : `Now day ${moved.to}`);
    },
    scheduleMore() {
      const added = scheduleProgramming(1);
      refresh2(`Scheduled ${added.length} more shows`);
    },
    // --- booking -----------------------------------------------------------
    changeFormat({ value }) {
      setDraftFormat(value);
      render();
    },
    changeTitle({ value }) {
      setDraftTitle(value);
      render();
    },
    bookSegment({ show: showId }, form) {
      const format = formatOf(draft.format);
      const slots = slotsFor(draft.format);
      const participants = slots.map((slot, i) => ({
        wrestlerId: form.querySelector(`#slot${i}`)?.value || "",
        side: slot.side
      })).filter((p) => p.wrestlerId);
      const titleId = draft.titleId || null;
      const verdict = validate(showId, draft.format, participants.map((p) => p.wrestlerId), { titleId });
      if (!verdict.ok) return toast(verdict.problems[0]);
      const typed = form.querySelector("#segName")?.value.trim();
      const limitMin = Math.max(1, Number(form.querySelector("#segLimit")?.value) || 10);
      try {
        bookSegment({
          showId,
          format: draft.format,
          kind: format.kind,
          titleId,
          name: typed || autoName(draft.format, participants, nameOf),
          timeLimitSec: limitMin * 60,
          participants
        });
        setDraftTitle("");
        refresh2(verdict.warnings.length ? verdict.warnings[0] : "Added to the card");
      } catch (err) {
        toast(err.message);
      }
    },
    cutSegment({ id }) {
      cutSegment(id, { reason: "Cut for time" });
      refresh2("Cut from the card");
    },
    // --- running the show --------------------------------------------------
    goLive({ id }) {
      try {
        stop();
        goLive(id);
        refresh2("On the air");
      } catch (err) {
        toast(err.message);
      }
    },
    changeOverride({ value }) {
      setOverride(value);
    },
    /**
     * Work out the next segment, then play it out on screen. Nothing is recorded
     * until the clock reaches the finish, so the card behind the panel cannot
     * give the result away.
     */
    runNext({ id }) {
      const step = previewNext(id, { overrideWinnerSide: draft.overrideSide || null });
      setOverride("");
      if (!step) return refresh2("The card is done");
      start(step, (result) => {
        commitResult(step.segment.id, result);
        const delta = result.actualSec - step.segment.timeLimitSec;
        refresh2(delta < -30 ? `${step.segment.name} ended ${mmssShort(-delta)} inside its limit` : `${step.segment.name} went the distance`);
      });
      render();
    },
    playbackSkip() {
      skip();
    },
    playbackSpeed({ value }) {
      setSpeed(value);
    },
    runRest({ id }) {
      stop();
      const steps = runRest(id);
      refresh2(`Ran the last ${steps.length} segment${steps.length === 1 ? "" : "s"}`);
    },
    goOffAir({ id }) {
      stop();
      const show = goOffAir(id);
      go(`show/${id}`);
      refresh2(`${show.name} rated ${show.result.rating}`);
    },
    nextWeek() {
      stop();
      const show = nextWeek();
      if (!show) return toast("Nothing left on the calendar");
      go(`show/${show.id}`);
      refresh2(`${show.name}, ${getState().calendar.day} days in`);
    },
    // --- log ---------------------------------------------------------------
    filterLog({ value }) {
      setFilter(value);
      render();
    }
  });
  function mmssShort(sec) {
    const s = Math.max(0, Math.round(sec));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  installSystems();
  bindEvents();
  var resumed = hasSave("auto") && load("auto").ok;
  if (!resumed && !location.hash) location.hash = "#/saves";
  on2("show.completed", () => save("auto", { label: "Autosave" }));
  on2("calendar.advanced", () => save("auto", { label: "Autosave" }));
  on2("segment.completed", () => save("auto", { label: "Autosave" }));
  renderHeader(isLoaded() ? getState() : null);
  render();
  window.WGM = { store: store_exports, persist: persist_exports, clock: clock_exports, checkState, seedRoster, seedTitles, runner: showRunner_exports, booking: booking_exports, rankings: rankings_exports };
})();

</script>
</body>
</html>
