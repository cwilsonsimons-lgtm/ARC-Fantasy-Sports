<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestling GM</title>
<link rel="icon" href="data:,">
<style>
/* css/app.css */
/* Wrestling GM.
   A game UI, not a document: committed to one dark world rather than following
   the viewer's theme, so every colour is painted explicitly and nothing is
   borrowed from the host. Blue carries anything live or selected, green and red
   carry good and bad news, and everything else stays out of the way. */

:root{
  color-scheme: dark;

  /* grounds, darkest to lightest */
  --bg:#070b11;
  --bg-deep:#04070b;
  --panel:#0d141d;
  --panel-2:#111a24;
  --raised:#16212e;
  --line:#1d2a38;
  --line-soft:#16202c;

  /* ink */
  --ink:#e8eef6;
  --ink-2:#b6c4d4;
  --muted:#7f92a8;
  --faint:#5b6c80;

  /* accents */
  --blue:#3b9bff;
  --blue-deep:#1d6fd0;
  --blue-wash:rgba(59,155,255,.12);
  --green:#3ec46d;
  --green-wash:rgba(62,196,109,.13);
  --red:#e5484d;
  --red-wash:rgba(229,72,77,.13);
  --amber:#f5b942;
  --amber-wash:rgba(245,185,66,.13);
  --violet:#9b7bff;

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r:8px;
  --r-sm:5px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;min-height:100%}

/* ---------------------------------------------------------------- top bar */
.topbar{
  display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;
  padding:.7rem 18px;
  background:linear-gradient(180deg,#0c141d,#080d14);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.identity{display:flex;align-items:center;gap:.7rem;min-width:0}
.mark{flex:0 0 auto;display:flex;line-height:0}
.wordmark{display:flex;flex-direction:column;min-width:0}
.product{
  font-weight:800;font-size:1.05rem;letter-spacing:.06em;
  color:var(--ink);line-height:1.1;
}
.tagline{
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);line-height:1.5;
}

.promotion{
  display:flex;flex-direction:column;min-width:0;
  padding-left:1.25rem;border-left:1px solid var(--line);
}
.promo-name{font-weight:600;color:var(--ink-2);font-size:.9rem;line-height:1.2}
.promo-sub{
  font:400 10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
}

.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.chip{
  display:flex;align-items:center;gap:.5rem;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:.4rem .7rem;min-width:0;position:relative;
}
.chip .ico{flex:0 0 auto;display:flex;color:var(--blue);line-height:0}
.chip .ico.green{color:var(--green)}
.chip .ico.amber{color:var(--amber)}
.chip .ico.violet{color:var(--violet)}
.chip .val{
  font:600 .95rem/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);
  white-space:nowrap;
}
.chip .cap{
  display:block;font:400 9px/1.4 var(--sans);letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);
}
.chip .badge{
  position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;
  background:var(--red);color:#fff;border-radius:9px;
  font:700 10px/17px var(--sans);text-align:center;
}

/* ------------------------------------------------------------------- tabs */
.tabs{
  display:flex;gap:.35rem;flex-wrap:wrap;
  padding:.6rem 18px;
  background:var(--bg-deep);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:15;
}
.tab{
  font:600 .82rem/1 var(--sans);letter-spacing:.02em;
  padding:.62rem 1.1rem;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  cursor:pointer;transition:background .12s,color .12s,border-color .12s;
}
.tab:hover{background:var(--raised);color:var(--ink)}
.tab.on{
  background:var(--blue);border-color:var(--blue);color:#04121f;
  box-shadow:0 0 0 1px rgba(59,155,255,.35),0 2px 10px rgba(59,155,255,.2);
}

/* ----------------------------------------------------------------- screen */
.screen{flex:1;padding:1rem 18px 4rem;max-width:104rem;width:100%;margin:0 auto}
h1{font-size:1.3rem;font-weight:700;margin:0 0 .2rem;letter-spacing:-.01em}
h2{
  font:700 .78rem/1.4 var(--sans);letter-spacing:.11em;text-transform:uppercase;
  color:var(--blue);margin:1.7rem 0 .6rem;
}
h3{font:700 .8rem/1.4 var(--sans);letter-spacing:.06em;color:var(--ink-2);margin:1.1rem 0 .5rem}
.sub{font-size:.82rem;color:var(--muted);margin:0 0 1rem}
p{margin:0 0 .7rem}
a{color:var(--blue)}

/* ---------------------------------------------------------------- columns */
.cols{display:grid;gap:1rem;grid-template-columns:1fr;align-items:start}
@media (min-width:64rem){ .cols.three{grid-template-columns:19rem minmax(0,1fr) 20rem} }
@media (min-width:64rem){ .cols.two{grid-template-columns:minmax(0,1fr) 20rem} }
@media (min-width:48rem) and (max-width:63.99rem){ .cols.three,.cols.two{grid-template-columns:1fr 1fr} }

/* ----------------------------------------------------------------- panels */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:1rem;overflow:hidden;
}
.panel > .head{
  display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;
  padding:.75rem .9rem .6rem;
}
.panel > .head h2,.panel > .head .title{
  margin:0;font:700 1rem/1.2 var(--sans);letter-spacing:-.01em;
  color:var(--blue);text-transform:none;
}
.panel > .head .meta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.panel > .body{padding:0 .9rem .9rem}
.panel > .body.flush{padding:0 0 .35rem}

/* ------------------------------------------------------------ roster list */
.rgroup{
  font:700 .74rem/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);padding:.85rem .9rem .4rem;
}
.rgroup .n{color:var(--faint);font-weight:400}
.rgrid{display:grid;grid-template-columns:1fr;gap:.35rem;padding:0 .9rem}
@media (min-width:30rem){ .rgrid.pair{grid-template-columns:1fr 1fr} }

.wcard{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  border-left:3px solid var(--faint);
  padding:.5rem .6rem;width:100%;text-align:left;cursor:pointer;
  font:inherit;color:var(--ink);
}
.wcard:hover{background:var(--raised);border-color:#2a3d52}
.wcard .who{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.wcard .nm,.wcard .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .nm{font-weight:600;font-size:.86rem}
.wcard .sub{margin:0;font:400 10px/1.4 var(--mono);color:var(--faint);letter-spacing:.03em}
.wcard.good{border-left-color:var(--green)}
.wcard.warn{border-left-color:var(--amber)}
.wcard.bad{border-left-color:var(--red)}

/* ------------------------------------------------------------------- tags */
.tag{
  display:inline-block;flex:0 0 auto;
  font:700 9.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
  padding:.3rem .42rem;border-radius:3px;
  background:var(--raised);color:var(--muted);border:1px solid var(--line);
}
.tag.blue{background:var(--blue-wash);color:var(--blue);border-color:rgba(59,155,255,.35)}
.tag.green{background:var(--green-wash);color:var(--green);border-color:rgba(62,196,109,.35)}
.tag.red{background:var(--red-wash);color:var(--red);border-color:rgba(229,72,77,.35)}
.tag.amber{background:var(--amber-wash);color:var(--amber);border-color:rgba(245,185,66,.35)}
.pill{ /* kept for older markup */
  display:inline-block;font:700 9.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
  padding:.3rem .42rem;border-radius:3px;background:var(--raised);color:var(--muted);border:1px solid var(--line);
}
.pill.brass{background:var(--blue-wash);color:var(--blue);border-color:rgba(59,155,255,.35)}
.pill.grease{background:var(--red-wash);color:var(--red);border-color:rgba(229,72,77,.35)}

/* ------------------------------------------------------------------ forms */
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin-bottom:.9rem}
.field{display:flex;flex-direction:column;min-width:8rem;flex:1 1 8rem}
.field.wide{flex:1 1 14rem}
label{
  font:600 10px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.3rem;
}
select,input[type=text],input[type=number],input:not([type]){
  font:400 .85rem/1 var(--sans);color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.6rem .65rem;width:100%;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:1.9rem}
select:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,155,255,.2)}
input[type=checkbox]{width:auto;accent-color:var(--blue)}

button.act{
  font:600 .82rem/1 var(--sans);color:var(--ink-2);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.62rem .9rem;cursor:pointer;transition:background .12s,color .12s,border-color .12s;
}
button.act:hover{background:var(--raised);color:var(--ink);border-color:#2a3d52}
button.act.primary{
  background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:700;
  box-shadow:0 2px 10px rgba(59,155,255,.22);
}
button.act.primary:hover{background:#56aaff;border-color:#56aaff;color:#04121f}
button.act.danger:hover{background:var(--red-wash);border-color:rgba(229,72,77,.5);color:var(--red)}
button.act:disabled{opacity:.4;cursor:not-allowed}
button.act:disabled:hover{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ----------------------------------------------------------------- tables */
.scroller{overflow-x:auto;margin-bottom:1rem;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:26rem}
th{
  font:700 9.5px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:left;white-space:nowrap;
  background:var(--bg-deep);border-bottom:1px solid var(--line);
  padding:.55rem .7rem;
}
td{border-bottom:1px solid var(--line-soft);padding:.6rem .7rem;vertical-align:top;color:var(--ink-2)}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.pos{color:var(--green)} .neg{color:var(--red)} .muted{color:var(--faint)}
.empty{color:var(--faint);font-style:italic;padding:1.1rem 0;text-align:center}
.rowlink{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.rowlink:hover{color:var(--blue)}

/* ------------------------------------------------------------------ cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem;margin-bottom:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem}
.card h3{
  font:700 9.5px/1.4 var(--sans);letter-spacing:.11em;text-transform:uppercase;
  color:var(--blue);margin:0 0 .55rem;
}
.kv{display:flex;justify-content:space-between;gap:.75rem;padding:.3rem 0;border-bottom:1px solid var(--line-soft);font-size:.8rem;color:var(--ink-2)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

.meter{height:4px;background:var(--bg-deep);border-radius:2px;margin-top:.3rem;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:2px}
.meter i.low{background:var(--red)}

/* --------------------------------------------------------------- show art */
.showart{
  border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#0a2647 0%,#06182e 55%,#0a2038 100%);
  padding:2rem 1rem;text-align:center;margin-bottom:.8rem;position:relative;
}
.showart::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(59,155,255,.22),transparent 62%);
}
.showart .kicker{
  position:relative;font:700 .68rem/1.4 var(--sans);letter-spacing:.24em;
  text-transform:uppercase;color:#9fc8f5;
}
.showart .big{
  position:relative;font:800 1.7rem/1.05 var(--sans);letter-spacing:-.02em;
  color:#fff;margin-top:.15rem;text-shadow:0 2px 18px rgba(59,155,255,.4);
}

/* ------------------------------------------------------------- card sheet */
.sheet{display:flex;flex-direction:column;gap:.3rem}
.slot{
  display:flex;align-items:center;gap:.6rem;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.55rem .65rem;
}
.slot.next{border-color:var(--blue);box-shadow:0 0 0 1px rgba(59,155,255,.3)}
.slot.done{opacity:.72}
.slot .idx{
  flex:0 0 auto;width:1.35rem;text-align:center;
  font:700 .72rem/1 var(--mono);color:var(--faint);
}
.slot .what{flex:1 1 auto;min-width:0}
.slot .what .t{font-weight:600;font-size:.85rem;overflow-wrap:anywhere}
.slot .what .d{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.slot .side{flex:0 0 auto;display:flex;align-items:center;gap:.45rem}
.slot .time{font:600 .76rem/1 var(--mono);color:var(--ink-2);white-space:nowrap}

/* ------------------------------------------------------------------- heat */
.heat{display:flex;align-items:center;gap:.5rem}
.heatbars{display:flex;gap:2px}
.heatbars i{display:block;width:5px;height:12px;border-radius:1px;background:var(--line)}
.heatbars i.on{background:var(--red)}
.heatval{font:700 .74rem/1 var(--mono);color:var(--red)}

/* ---------------------------------------------------------------- playback */
.playback{
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:var(--r);padding:.9rem 1rem;margin-bottom:1rem;
}
.playback.done{border-left-color:var(--green)}
.pb-head{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.6rem;font-size:.85rem}
.pb-clock{font:700 2.6rem/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink)}
.pb-bar{height:6px;margin:.55rem 0 .7rem}
.pb-result{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.2rem;margin-bottom:.6rem}
.pb-outcome{font-size:1.05rem;font-weight:700}
.pb-feed{min-height:5.6rem}
.pb-controls{margin:0}

/* -------------------------------------------------------------------- log */
.log{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.log .ev{
  display:grid;grid-template-columns:4.4rem 9.5rem 1fr;gap:.6rem;
  padding:.35rem 0;border-bottom:1px solid var(--line-soft);
}
.log .ev:last-child{border-bottom:0}
.log .ev .d{color:var(--faint)}
.log .ev .t{color:var(--blue);overflow-wrap:anywhere}
.pb-feed .ev{grid-template-columns:3.4rem 1fr;padding:.22rem 0;border-bottom:0}
.pb-feed .ev.fin span:last-child{color:var(--blue);font-weight:700}
@media (max-width:40rem){ .log .ev{grid-template-columns:1fr;gap:.1rem} }

details summary{cursor:pointer}

/* ------------------------------------------------------------------ toast */
.toast{
  position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%) translateY(1rem);
  background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-left:3px solid var(--blue);border-radius:var(--r-sm);
  font:500 .82rem/1.3 var(--sans);padding:.65rem 1rem;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100vw - 36px);z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ .toast,.tab,button.act{transition:none} }

@media (max-width:48rem){
  .topbar{gap:.7rem;padding:.6rem 14px}
  .promotion{padding-left:0;border-left:0;order:3;width:100%}
  .chips{order:2}
  .tabs{padding:.5rem 14px;overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap}
  .screen{padding:.9rem 14px 4rem}
}

</style>
</head>

  var SPEEDS = Object.freeze({

  var SPEED_KEY = "wgm_playback_speed";
  var TICK_MS = 50;
  function readSpeed() {
    try {
      const stored = localStorage.getItem(SPEED_KEY);
      if (stored && SPEEDS[stored]) return stored;
    } catch {
    }
    return "normal";
  }
  var speed = readSpeed();
  var state = null;

  function isActive() {

  function setSpeed(next) {
    if (!SPEEDS[next]) return;

    }
    if (state && !state.finished && SPEEDS[next].msPerSec === 0) finish();
    else paint();

      clockSec: 0,
      finished: false,
      startedAt: Date.now()
    };
    if (SPEEDS[speed].msPerSec === 0) return finish();
    timer = setInterval(() => {
      const elapsed = Date.now() - state.startedAt;
      state.clockSec = elapsed / SPEEDS[speed].msPerSec;
      if (state.clockSec >= state.result.actualSec) finish();
      else paint();
    }, TICK_MS);
    paint();
  }

      const titleId = draft.titleId || null;
      const verdict = validate(showId, draft.format, participants.map((p) => p.wrestlerId), { titleId });
      if (!verdict.ok) return toast(verdict.problems[0]);
      const typed = form.querySelector("#segName")?.value.trim();
      const limitMin = Math.max(1, Number(form.querySelector("#segLimit")?.value) || 10);
      try {
        bookSegment({
          showId,
          format: draft.format,
          kind: format.kind,
          titleId,
          name: typed || autoName(draft.format, participants, nameOf),
          timeLimitSec: limitMin * 60,
          participants
        });
        setDraftTitle("");
        refresh2(verdict.warnings.length ? verdict.warnings[0] : "Added to the card");
      } catch (err) {
        toast(err.message);
      }
    },
    cutSegment({ id }) {
      cutSegment(id, { reason: "Cut for time" });
      refresh2("Cut from the card");
    },
    // --- running the show --------------------------------------------------
    goLive({ id }) {
      try {
        stop();
        goLive(id);
        refresh2("On the air");
      } catch (err) {
        toast(err.message);
      }
    },
    changeOverride({ value }) {
      setOverride(value);
    },
    /**
     * Work out the next segment, then play it out on screen. Nothing is recorded
     * until the clock reaches the finish, so the card behind the panel cannot
     * give the result away.
     */
    runNext({ id }) {
      const step = previewNext(id, { overrideWinnerSide: draft.overrideSide || null });
      setOverride("");
      if (!step) return refresh2("The card is done");
      start(step, (result) => {
        commitResult(step.segment.id, result);
        const delta = result.actualSec - step.segment.timeLimitSec;
        refresh2(delta < -30 ? `${step.segment.name} ended ${mmssShort(-delta)} inside its limit` : `${step.segment.name} went the distance`);
      });
      render();
    },
    playbackSkip() {
      skip();
    },
    playbackSpeed({ value }) {
      setSpeed(value);
    },
    runRest({ id }) {
      stop();
      const steps = runRest(id);
      refresh2(`Ran the last ${steps.length} segment${steps.length === 1 ? "" : "s"}`);
    },
    goOffAir({ id }) {
      stop();
      const show = goOffAir(id);
      go(`show/${id}`);
      refresh2(`${show.name} rated ${show.result.rating}`);
    },
    nextWeek() {
      stop();
      const show = nextWeek();
      if (!show) return toast("Nothing left on the calendar");
      go(`show/${show.id}`);
      refresh2(`${show.name}, ${getState().calendar.day} days in`);
    },
    denyRequest({ id }) {
      const request = getRequest(id);
      denyRequest(id, { reason: "Told no by the GM" });
      refresh2(request ? `${nameOf(request.wrestlerId)} was told no` : "Refused");
    },
    // --- log ---------------------------------------------------------------
    filterLog({ value }) {
      setFilter(value);
      render();
    }
  });
  function mmssShort(sec) {
    const s = Math.max(0, Math.round(sec));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  installSystems();
  bindEvents();
  var resumed = hasSave("auto") && load("auto").ok;
  if (!resumed && !location.hash) location.hash = "#/saves";
  on2("show.completed", () => save("auto", { label: "Autosave" }));
  on2("calendar.advanced", () => save("auto", { label: "Autosave" }));
  on2("segment.completed", () => save("auto", { label: "Autosave" }));
  renderHeader(isLoaded() ? getState() : null);
  render();
  window.WGM = { store: store_exports, persist: persist_exports, clock: clock_exports, checkState, seedRoster, seedTitles, runner: showRunner_exports, booking: booking_exports, rankings: rankings_exports };
})();

</script>
