<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestling GM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="identity">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30">
            <rect x="1" y="1" width="30" height="30" rx="7" fill="#12202e" stroke="#2a3f56"/>
            <path d="M8 21V11h3.4l4.6 6 4.6-6H24v10h-3v-5.4L16.6 21h-1.2L11 15.6V21z" fill="#3b9bff"/>
          </svg>
        </div>
        <div class="wordmark">
          <span class="product">WRESTLING GM</span>
          <span class="tagline">Book stories. They still have opinions.</span>
        </div>
      </div>

      <div class="promotion">
        <span class="promo-name" id="brandName">Wrestling GM</span>
        <span class="promo-sub" id="gmName">no game loaded</span>
      </div>

      <div class="chips" id="chips"></div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main id="screen" class="screen"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
