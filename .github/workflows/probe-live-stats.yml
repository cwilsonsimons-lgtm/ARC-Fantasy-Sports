# One-off: fetch real Sleeper/ESPN responses so the app can be built against
# their actual shapes (the dev container cannot reach these hosts). Commits
# trimmed samples to docs/probe/ on this branch.
name: Probe live-stats APIs
on:
  push:
    branches: [claude/gifted-meitner-r7wwin]
    paths: [.github/workflows/probe-live-stats.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p docs/probe && cd docs/probe
          curl -sS -m 60 "https://api.sleeper.com/stats/nfl/2026/3?season_type=regular" -o s3.raw
          curl -sS -m 60 "https://api.sleeper.com/projections/nfl/2026/4?season_type=regular" -o p4.raw
          curl -sS -m 60 https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard -o sb.raw
          curl -sS -m 60 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260924-20260929" -o sb3.raw
          python3 - <<'PY'
          import json, collections
          s3 = json.load(open('s3.raw')); p4 = json.load(open('p4.raw'))
          keys = collections.Counter()
          ex = {}
          for r in s3:
              pos = (r.get('player') or {}).get('position')
              if pos in ('QB','RB','WR','TE'):
                  keys.update(r['stats'].keys())
                  if pos not in ex and r['stats'].get('pts_ppr', 0) > 15: ex[pos] = r
          og = [r for r in s3 + p4 if (r.get('player') or {}).get('last_name','').startswith('Gordon') and (r.get('player') or {}).get('first_name') == 'Ollie']
          pk = collections.Counter()
          for r in p4:
              if (r.get('player') or {}).get('position') in ('QB','RB','WR','TE'): pk.update(r['stats'].keys())
          json.dump({'stat_keys': sorted(keys), 'proj_keys': sorted(pk), 'examples': ex, 'ollie': og[:2],
                     'player_fields': sorted({k for r in s3 for k in (r.get('player') or {})})}, open('offense.json','w'), indent=1)
          def board(f):
              b = json.load(open(f)); ev = b.get('events', [])
              e = ev[0] if ev else {}
              c = (e.get('competitions') or [{}])[0]
              return {'n': len(ev), 'week': b.get('week'), 'event_keys': list(e.keys()), 'comp_keys': list(c.keys()),
                      'status': c.get('status'), 'competitors': [{'homeAway': t.get('homeAway'), 'abbr': t['team'].get('abbreviation'), 'score': t.get('score')} for t in c.get('competitors', [])],
                      'all': [{'id': x['id'], 'date': x['date'], 'state': x['status']['type']['state'], 'abbr': [t['team']['abbreviation'] for t in x['competitions'][0]['competitors']]} for x in ev]}
          json.dump({'live': board('sb.raw'), 'wk3': board('sb3.raw')}, open('board.json','w'), indent=1)
          PY
          rm -f *.raw
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add docs/probe && git commit -m "Probe: offensive stat keys and scoreboard" && git push || echo nothing
