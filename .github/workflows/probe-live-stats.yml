# One-off: fetch real Sleeper/ESPN responses so the app can be built against
# their actual shapes (the dev container cannot reach these hosts). Commits
# trimmed samples to docs/probe/ on this branch.
name: Probe live-stats APIs
on:
  push:
    branches: [claude/gifted-meitner-r7wwin]
    paths: [.github/workflows/probe-live-stats.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p docs/probe && cd docs/probe
          C='curl -sS --compressed -m 60'
          $C "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=3" -o a.raw
          $C "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260927" -o b.raw
          $C "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=3" -o c.raw
          python3 - <<'PY'
          import json, subprocess
          out = {}
          for n in 'abc':
              try:
                  d = json.load(open(n + '.raw')); ev = d.get('events', [])
                  out[n] = {'n': len(ev), 'week': d.get('week'), 'games': [[e['id'], e['date'], e['status']['type']['state'], [t['team']['abbreviation'] for t in e['competitions'][0]['competitors']]] for e in ev]}
              except Exception as e:
                  out[n] = str(e)
          ev = (out.get('a') or {}).get('games') or (out.get('b') or {}).get('games') or []
          if ev:
              subprocess.run(['bash', '-c', f"curl -sS --compressed -m 60 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={ev[0][0]}' -o s.raw"])
              s = json.load(open('s.raw'))
              out['summary'] = [{'text': x['text'], 'period': x['period'], 'clock': x['clock'], 'team': x['team']['abbreviation'], 'type': x['type']['text']} for x in s.get('scoringPlays', [])]
          json.dump(out, open('board2.json', 'w'), indent=1)
          PY
          rm -f *.raw
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add docs/probe && git commit -m "Probe: ESPN by week" && git push || echo nothing
