# One-off: see what injury data Sleeper (and ESPN) give, in their real shapes
# (the dev container cannot reach these hosts). Commits trimmed samples to
# tools/fixtures/live/ on this branch; removed once the app is built on them.
name: Probe injury data
on:
  push:
    branches: [claude/gifted-meitner-r7wwin]
    paths: [.github/workflows/probe-injuries.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p tools/fixtures/live docs/probe && cd tools/fixtures/live
          C='curl -sS --compressed -m 120'
          $C https://api.sleeper.app/v1/state/nfl -o state.raw
          W=$(python3 -c "import json;print(json.load(open('state.raw'))['week'])")
          echo "week $W"
          $C "https://api.sleeper.com/projections/nfl/2026/$W?season_type=regular" -o proj.raw
          $C "https://api.sleeper.com/stats/nfl/2026/$W?season_type=regular" -o stats.raw
          $C https://api.sleeper.app/v1/players/nfl -o players.raw
          $C "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries" -o espn_inj.raw
          {
            echo "== CORS (Origin: https://raw.githack.com)"
            for u in "https://api.sleeper.com/projections/nfl/2026/$W?season_type=regular" https://api.sleeper.app/v1/players/nfl "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries"; do
              echo "-- $u"; curl -sS -m 60 -o /dev/null -D - -H 'Origin: https://raw.githack.com' -H 'Accept-Encoding: gzip' "$u" | grep -i 'access-control\|content-length\|content-encoding\|cache-control' || true
            done
          } > ../../../docs/probe/injuries-cors.txt
          python3 - "$W" <<'PY'
          import json, sys, collections, os
          W = sys.argv[1]
          out = []
          F = ('injury_status','injury_body_part','injury_notes','injury_start_date','practice_participation','practice_description','status','news_updated')
          for name in ('proj', 'stats'):
              d = json.load(open(f'{name}.raw'))
              keys = collections.Counter(k for r in d for k in (r.get('player') or {}).keys())
              st = collections.Counter((r.get('player') or {}).get('injury_status') for r in d)
              out.append(f'== {name} week {W}: {len(d)} rows; player keys: {dict(keys)}')
              out.append(f'   injury_status: {dict(st)}')
              rows = [{'player_id': r['player_id'], 'team': r.get('team'), 'player': {k: v for k, v in (r.get('player') or {}).items() if k in F + ('first_name','last_name','position','team')}}
                      for r in d if (r.get('player') or {}).get('position') in ('QB','RB','WR','TE','K','DEF')]
              json.dump(rows, open(f'inj_{name}_{W}.json', 'w'), separators=(',', ':'))
          p = json.load(open('players.raw'))
          out.append(f'== players/nfl: {len(p)} players, {os.path.getsize("players.raw")} bytes')
          one = next(v for v in p.values() if v.get('injury_status'))
          out.append('   sample injured: ' + json.dumps({k: one.get(k) for k in sorted(one) if k not in ('metadata',)})[:1500])
          st = collections.Counter(v.get('injury_status') for v in p.values() if v.get('active'))
          out.append(f'   injury_status (active): {dict(st)}')
          out.append(f'   status: {dict(collections.Counter(v.get("status") for v in p.values() if v.get("team")))}')
          out.append(f'   practice_participation: {dict(collections.Counter(v.get("practice_participation") for v in p.values() if v.get("injury_status")))}')
          inj = {k: {f: v.get(f) for f in F + ('full_name','position','team')} for k, v in p.items() if v.get('injury_status') or (v.get('team') and v.get('status') not in (None, 'Active'))}
          json.dump(inj, open('players_injuries.json', 'w'), separators=(',', ':'))
          out.append(f'   saved {len(inj)} injured / not-active players')
          try:
              e = json.load(open('espn_inj.raw'))
              out.append('== espn injuries: keys ' + str(list(e.keys())))
              t = (e.get('injuries') or [{}])[0]
              out.append('   first team: ' + json.dumps(t)[:1500])
          except Exception as ex:
              out.append(f'== espn injuries: {ex}; ' + open('espn_inj.raw', errors='replace').read()[:300])
          open('../../../docs/probe/injuries.txt', 'w').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY
          rm -f *.raw
          ls -la inj_* players_injuries.json
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add docs/probe tools/fixtures && git commit -m "Injury data samples from Sleeper and ESPN" && git push || echo nothing
