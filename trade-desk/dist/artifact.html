<title>Trade Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: a trading-desk board. A dense header strip, a scrollable tab row, then one column of
   ledger-style tables on phones, two columns from 960px. Numbers set in mono so they line up. */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --surface-2: #f6f8f6;
  --ink: #142019;
  --ink-2: #4f5d55;
  --ink-3: #7a877f;
  --line: #d7ddd8;
  --line-2: #e6eae7;
  --accent: #1f4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfd;
  --up: #157a47;
  --up-soft: #e1f2e8;
  --down: #b83b26;
  --down-soft: #f9e5e0;
  --warn: #9a6512;
  --pos-qb: #c23a5e;
  --pos-rb: #12876a;
  --pos-wr: #2a6fc4;
  --pos-te: #b86b12;
  --pos-pick: #6655c4;
  --series-1: #257de0;
  --series-2: #f47230;
  --series-3: #00a888;
  --series-market: #59655e;
  --shadow: 0 1px 2px rgb(20 32 25 / 0.06), 0 6px 24px rgb(20 32 25 / 0.08);
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1210;
    --surface: #151c19;
    --surface-2: #1b2420;
    --ink: #e4ebe7;
    --ink-2: #a9b6af;
    --ink-3: #7d8a83;
    --line: #2b3632;
    --line-2: #222c28;
    --accent: #7c9cff;
    --accent-ink: #0d1210;
    --accent-soft: #1d2747;
    --up: #4cc387;
    --up-soft: #15301f;
    --down: #f07a62;
    --down-soft: #3a1d17;
    --warn: #e0a84a;
    --pos-qb: #f07896;
    --pos-rb: #3fc9a3;
    --pos-wr: #6fa8f2;
    --pos-te: #eaa354;
    --pos-pick: #a597f2;
    --series-1: #338ced;
    --series-2: #e76624;
    --series-3: #00a888;
    --series-market: #9aa7a0;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 28px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1210;
  --surface: #151c19;
  --surface-2: #1b2420;
  --ink: #e4ebe7;
  --ink-2: #a9b6af;
  --ink-3: #7d8a83;
  --line: #2b3632;
  --line-2: #222c28;
  --accent: #7c9cff;
  --accent-ink: #0d1210;
  --accent-soft: #1d2747;
  --up: #4cc387;
  --up-soft: #15301f;
  --down: #f07a62;
  --down-soft: #3a1d17;
  --warn: #e0a84a;
  --pos-qb: #f07896;
  --pos-rb: #3fc9a3;
  --pos-wr: #6fa8f2;
  --pos-te: #eaa354;
  --pos-pick: #a597f2;
  --series-1: #338ced;
  --series-2: #e76624;
  --series-3: #00a888;
  --series-market: #9aa7a0;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 28px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.up { color: var(--up); }
.down { color: var(--down); }

/* ---------- header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1200px;
  margin: 0 auto;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wordmark {
  font: 800 24px/1 var(--font-display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.wordmark small { font: 600 13px/1 var(--font-display); letter-spacing: 0.08em; color: var(--ink-2); }
.asof { font-size: 12px; color: var(--ink-2); margin-left: auto; display: flex; gap: 10px; align-items: center; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0;
  background: none;
  padding: 9px 12px 10px;
  font: 700 15px/1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
  border-bottom: 3px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-current='page'] { color: var(--ink); border-bottom-color: var(--accent); }

main {
  max-width: 1200px;
  margin: 0 auto;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 16px;
}
.cols { display: grid; gap: 16px; }
@media (min-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.cols > * { min-width: 0; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.panel-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
  flex-wrap: wrap;
}
.panel-h h2, .h2 {
  margin: 0;
  font: 700 17px/1.1 var(--font-display);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-wrap: balance;
}
.panel-h .sub { color: var(--ink-2); font-size: 12px; }
.panel-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-b { padding: 14px; }
.note { font-size: 13px; color: var(--ink-2); margin: 0; max-width: 68ch; }
.banner {
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--accent-soft);
  font-size: 13px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.banner.bad { background: var(--down-soft); }

/* ---------- team strip ---------- */
.strip { display: grid; gap: 14px; grid-template-columns: 1fr; padding: 14px; }
@media (min-width: 720px) { .strip { grid-template-columns: minmax(200px, 1fr) 2fr; } }
.teamname { font: 800 28px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.win { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.bar-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.bar-t { position: relative; height: 8px; background: var(--line-2); border-radius: 4px; }
.bar-f { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.bar-avg { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); left: 50%; }

/* ---------- position tags ---------- */
.pos {
  display: inline-block;
  min-width: 30px;
  text-align: center;
  font: 700 11px/16px var(--font-mono);
  border-radius: 4px;
  padding: 0 4px;
  color: #fff;
}
.pos-QB { background: var(--pos-qb); }
.pos-RB { background: var(--pos-rb); }
.pos-WR { background: var(--pos-wr); }
.pos-TE { background: var(--pos-te); }
.pos-PICK { background: var(--pos-pick); }
:root[data-theme='dark'] .pos { color: #0d1210; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .pos { color: #0d1210; } }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left;
  font: 600 11px/1 var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  background: var(--surface);
}
.tbl th.r, .tbl td.r { text-align: right; }
.tbl th button { all: unset; cursor: pointer; }
.tbl th button:hover { color: var(--ink); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-s { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.tag.inj { color: var(--down); border-color: currentColor; }
.delta { font-size: 12px; }
.trend { font-size: 12px; white-space: nowrap; }
@media (max-width: 640px) {
  .hide-sm { display: none; }
  .tbl th, .tbl td { padding: 8px 6px; }
  .tbl td:first-child, .tbl th:first-child { padding-left: 12px; }
  .who-n { white-space: normal; }
  .panel-h .sub { flex-basis: 100%; }
}
.tbl td .factors { min-width: 200px; }
.sell { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.sell:last-child { border-bottom: 0; }
.sell:hover { background: var(--surface-2); }
.sell-to { grid-column: 1; min-width: 0; padding-left: 38px; }
.sell > .btn { grid-column: 2; grid-row: 1 / span 2; }
@media (min-width: 720px) { .sell { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; } .sell-to { grid-column: 2; padding-left: 0; } .sell > .btn { grid-column: 3; grid-row: 1; } }

/* ---------- buttons & fields ---------- */
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--down); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 14px;
  color: var(--ink);
}
.textarea { min-height: 140px; font-family: var(--font-mono); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed='true'] { background: var(--ink); color: var(--surface); }

/* ---------- trade lab ---------- */
.lab { display: grid; gap: 16px; }
@media (min-width: 960px) { .lab { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.picker-list { max-height: 360px; overflow-y: auto; }
.pick-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 7px 14px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
}
.pick-row:hover { background: var(--surface-2); }
.pick-row[aria-checked='true'] { background: var(--accent-soft); }
.pick-row input { accent-color: var(--accent); }
.basket { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); min-height: 46px; align-items: center; }
.bchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; }
.bchip button { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 14px; line-height: 1; padding: 0 4px; }
.verdict { display: grid; gap: 14px; padding: 14px; }
@media (min-width: 640px) { .verdict { grid-template-columns: 1fr 1fr; } }
.view { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px; background: var(--surface-2); min-width: 0; }
.view h3 { margin: 0 0 8px; font: 700 14px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; }
.big { font: 700 30px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 5px; background: var(--line-2); position: relative; overflow: hidden; margin: 8px 0 4px; }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.lik { font: 700 15px/1.1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.why { font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; margin-top: 8px; }
.outcomes { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- league ---------- */
.teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.tcard.me { border-color: var(--accent); }
.tcard h3 { margin: 0; font: 800 20px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.heat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.heat div { border-radius: 6px; padding: 6px 4px; text-align: center; font-size: 11px; }
.heat b { display: block; font: 600 13px/1.1 var(--font-mono); }
.lessons { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12px; }

/* ---------- log ---------- */
.log-row { display: grid; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.log-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.log-sides { display: grid; gap: 4px; font-size: 13px; }
@media (min-width: 720px) { .log-sides { grid-template-columns: 1fr 1fr; } }
.oc { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.oc-rejected, .oc-countered { background: var(--down-soft); color: var(--down); }
.oc-accepted, .oc-completed, .oc-offered { background: var(--up-soft); color: var(--up); }
.oc-pending { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgb(8 12 10 / 0.45); z-index: 20; display: flex; justify-content: flex-end; }
.sheet {
  width: min(720px, 100%);
  height: 100%;
  background: var(--bg);
  overflow-y: auto;
  box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-h {
  position: sticky;
  top: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 12px;
  align-items: flex-start;
  z-index: 1;
}
.sheet-h h2 { margin: 0; font: 800 26px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.sheet-b { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat .l { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.stat .v { font: 600 20px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.factors { display: flex; flex-wrap: wrap; gap: 4px; }
.factor { font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.factor.pos-f { background: var(--up-soft); color: var(--up); }
.factor.neg-f { background: var(--down-soft); color: var(--down); }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; line-height: 1; }
.stepper span { min-width: 40px; text-align: center; font: 12px var(--font-mono); }

/* ---------- chart ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line-2); stroke-width: 1; }
.chart .axis text { fill: var(--ink-3); font: 11px var(--font-mono); }
.chart .dlabel { fill: var(--ink-2); font: 600 11px var(--font-body); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip {
  position: absolute;
  pointer-events: none;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  min-width: 150px;
  z-index: 2;
}
.tip .kv { font-size: 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty h3 { margin: 0; font: 700 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); }
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink);
  color: var(--surface);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 30;
  box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
.howto { display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); }
.howto b { color: var(--ink); }
.howto p { margin: 0; max-width: 72ch; }

/* ---------- editable rankings ---------- */
.input.edit { padding: 4px 8px; font-size: 13px; text-align: right; }
.stat .input.edit { font-size: 18px; font-weight: 600; text-align: left; padding: 2px 6px; margin-top: 2px; }
.src { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
.src span { color: var(--ink-3); }
.src .src-you { color: var(--accent); font-weight: 700; }
.src .src-KTC { color: var(--pos-pick); }
.tbl tr.edited td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.moves { display: inline-flex; gap: 4px; }
.moves .btn { padding: 4px 7px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) { .rank-tbl .who-s { display: none; } .rank-tbl .input.edit { width: 64px !important; } .rank-tbl td:first-child .input.edit { width: 44px !important; } }
