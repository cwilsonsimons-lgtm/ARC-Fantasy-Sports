<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090D">
<title>Universe — WWE 2K25 companion</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/universe.css">
</head>
<body>
<!-- Universe: a companion for WWE 2K25's Universe Mode. A standalone app - it
     shares this repository's build and test tooling with the City Boys
     Dynasty fantasy app (index.html), and nothing else. -->
<div class="uv-app">
  <div class="uv" id="uv">
    <div class="uv-head">
      <div class="uv-brand">
        <div class="a">Universe</div>
        <div class="m" id="uvClock"></div>
      </div>
      <div class="uv-ic" id="uvDataBtn" onclick="uvData()" title="Save file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><rect x="8" y="13" width="8" height="5" rx="1"/></svg></div>
    </div>
    <div class="uv-tabs" id="uvTabs"></div>
    <div class="uv-scroll" id="uvScroll"><div id="uvBody"></div></div>

    <div class="uv-scrim" onclick="uvCloseSheet()"></div>
    <div class="uv-sheet" id="uvSheet">
      <div class="grab"></div>
      <div class="hd" id="uvSheetTitle"></div>
      <div class="bd" id="uvSheetBody"></div>
    </div>
    <div class="uv-confirm" onclick="if(event.target===this)uvConfirmNo()">
      <div class="box">
        <div class="t" id="uvConfirmTitle"></div>
        <div class="x" id="uvConfirmText"></div>
        <div class="uv-row2">
          <div class="uv-btn" onclick="uvConfirmNo()">Cancel</div>
          <div class="uv-btn bad" id="uvConfirmYes" onclick="uvConfirmYes()">Confirm</div>
        </div>
      </div>
    </div>
    <div id="uvHint"></div>
    <input type="file" accept="application/json,.json" id="uvImport" onchange="uvImportFile(this)">
  </div>
</div>

<script type="module" src="js/universe/main.js"></script>
</body>
</html>
