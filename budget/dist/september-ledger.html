<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Running Ledger</title>
</head>
<body>
<style>
  :root{
    --ink:#12271F; --ink-soft:#2E4A3E; --paper:#E9E4D4; --paper-lit:#F3EFE2;
    --rule:#BFB7A0; --rule-soft:#D5CDB8; --debit:#A83220; --credit:#2C6B4C;
    --amber:#C98A22; --muted:#6B7A70;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45; padding:20px 16px 104px;
    max-width:560px; margin:0 auto; font-variant-numeric:tabular-nums;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
  h1{font-size:28px;letter-spacing:-.4px;line-height:1.1}
  h2{font-size:19px;margin-bottom:10px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .link{background:none;border:0;padding:0;font:inherit;font-size:inherit;color:var(--ink-soft);text-decoration:underline;cursor:pointer}

  .hero{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:8px}
  .months{display:flex;align-items:center;gap:6px}
  .mnow{flex:1;min-width:0;text-align:center}
  .mnav{background:transparent;border:1px solid var(--rule);color:var(--ink);font:inherit;font-size:20px;
    line-height:1;padding:6px 13px;cursor:pointer;flex:none}
  .mnav:hover{background:var(--ink);color:var(--paper-lit);border-color:var(--ink)}
  .backnow{display:block;width:100%;margin-top:10px;padding:8px;background:var(--paper-lit);
    border:1px dashed var(--rule);font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .edit-btn{background:transparent;border:1px solid var(--rule);color:var(--ink);font:inherit;font-size:13px;padding:7px 11px;cursor:pointer;white-space:nowrap}

  .figure{padding:16px 0 14px}
  .figure + .figure{border-top:1px solid var(--rule-soft)}
  .fig-label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .big{font-family:Georgia,"Iowan Old Style",serif;font-size:50px;line-height:1;margin:8px 0 6px;letter-spacing:-1px}
  .big.second{font-size:34px;letter-spacing:-.5px}
  .big.over{color:var(--debit)}
  .fig-note{font-size:13.5px;color:var(--muted);line-height:1.5;max-width:44ch}
  .fig-note b{color:var(--ink-soft);font-weight:600}

  .today-line{margin-top:10px}
  .today-line .tl-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .tl-bar{height:6px;background:var(--paper-lit);border:1px solid var(--rule-soft);margin-top:5px}
  .tl-bar span{display:block;height:100%;background:var(--ink-soft)}
  .tl-bar span.over{background:var(--debit)}

  .split{display:flex;gap:18px;margin-top:4px;padding-top:12px;border-top:1px solid var(--rule-soft)}
  .split div{flex:1}
  .split b{font-family:Georgia,serif;font-size:19px;font-weight:600;display:block}
  .split small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
  .split b.over{color:var(--debit)}
  .split b.up{color:var(--credit)}
  .bar{display:flex;height:16px;background:var(--paper-lit);border:1px solid var(--rule);margin-top:16px;overflow:hidden}
  .bar span{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
  .legend i{display:inline-block;width:9px;height:9px;margin-right:5px}

  .warn{background:#F6E3DE;border:1px solid var(--debit);color:#7A2416;padding:11px 12px;font-size:14px;margin-top:16px;line-height:1.45}

  .plan-switch{display:flex;margin:22px 0 8px;border:1px solid var(--ink)}
  .plan-switch button{flex:1;padding:11px 8px;background:transparent;border:0;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;border-right:1px solid var(--ink)}
  .plan-switch button:last-child{border-right:0}
  .plan-switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper-lit)}

  .cal{margin-top:26px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);margin-bottom:4px}
  .dow div{text-align:center}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .day{aspect-ratio:1/1.2;background:var(--paper-lit);border:1px solid var(--rule-soft);padding:3px 2px 2px;font-size:11px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;color:var(--ink);font-family:inherit}
  .day.blank{background:transparent;border:0;cursor:default}
  .day.past{opacity:.55}
  .day .n{font-weight:600;font-size:12px}
  .day.today{border:2px solid var(--amber);opacity:1}
  .day.neg{background:#F6E3DE}
  .day .spent{color:var(--debit);font-size:10px;line-height:1.1}
  .day .earned{color:var(--credit);font-size:10px;line-height:1.1;font-weight:600}
  .day .planned{color:var(--muted);font-size:9px;line-height:1.1;text-align:center}
  .day .bal{font-size:9px;color:var(--ink-soft);line-height:1.1;margin-top:auto}
  .day .bal.neg{color:var(--debit);font-weight:600}
  .marks{display:flex;gap:2px;height:6px}
  .marks i{width:5px;height:5px;border-radius:50%}
  .m-sub{background:var(--amber)} .m-pay{background:var(--credit)} .m-bill{background:var(--debit)}

  .cats{margin-top:30px}
  .cat{border-bottom:1px solid var(--rule-soft);padding:11px 0}
  .cat-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
  .cat-top span{color:var(--muted);font-size:13px}
  .cat-bar{height:5px;background:var(--paper-lit);border:1px solid var(--rule-soft);margin-top:6px}
  .cat-bar span{display:block;height:100%}

  .askbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:2px solid var(--ink);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .askbar button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--ink);color:var(--paper-lit);border:0;font:inherit;font-size:15px;padding:12px 14px;cursor:pointer;text-align:left}
  .askbar button span{color:#C9D6CE;font-size:13px}

  .tip{position:fixed;z-index:18;display:none;max-width:280px;min-width:190px;
    background:var(--paper-lit);border:1px solid var(--ink);box-shadow:0 6px 18px rgba(18,39,31,.18);
    padding:9px 11px;font-size:12.5px;line-height:1.4;color:var(--ink);
    font-variant-numeric:tabular-nums;pointer-events:none}
  .tip.on{display:block}
  .tip-h{font-family:Georgia,"Iowan Old Style",serif;font-size:13.5px;font-weight:600;
    padding-bottom:5px;margin-bottom:5px;border-bottom:1px solid var(--rule-soft)}
  .tip-r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:2px 0}
  .tip-r em{font-style:normal;color:var(--muted);font-size:11px}
  .tip-r b{font-weight:600;white-space:nowrap}
  .tip-r b.neg{color:var(--debit)}
  .tip-r b.pos{color:var(--credit)}
  .tip-net{border-top:1px solid var(--rule-soft);margin-top:5px;padding-top:5px}
  .tip-f{color:var(--muted)}
  .tip-f b{color:var(--ink);font-weight:600}
  .tip-e{color:var(--muted);padding:2px 0}

  .sheet-bg{position:fixed;inset:0;background:rgba(18,39,31,.45);display:none;z-index:20}
  .sheet-bg.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper-lit);border-top:2px solid var(--ink);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;display:none;max-width:560px;margin:0 auto}
  .sheet.on{display:block}
  .sheet.chat{display:none;flex-direction:column;height:88vh;overflow:hidden;padding-bottom:0}
  .sheet.chat.on{display:flex}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
  .x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;
    min-width:44px;min-height:44px;padding:0;flex:none;
    display:inline-flex;align-items:center;justify-content:center;margin:-8px -10px 0 0}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
  .quick button{padding:11px 8px;background:var(--paper);border:1px solid var(--rule);font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
  .quick button b{display:block;font-weight:600}
  .quick button em{font-style:normal;color:var(--muted);font-size:12px}
  .quick button.newq{border-style:dashed;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;text-align:center}
  .quick.editing button{border-color:var(--debit);color:var(--debit)}
  .quick.editing button em{color:var(--debit)}
  .quick.editing button.newq{border-color:var(--ink);color:var(--ink);border-style:solid}
  .qedit{border:1px solid var(--rule);background:var(--paper);padding:11px 12px;margin-bottom:12px}

  .inc-head{display:grid;grid-template-columns:52px 1fr 84px 44px;gap:6px;margin-top:12px;
    font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .inc-row{display:grid;grid-template-columns:52px 1fr 84px 44px;gap:6px;align-items:center;margin-top:6px}
  .inc-row input{padding:9px 7px;font-size:15px}
  .inc-row button{background:none;border:0;color:var(--debit);font-size:20px;cursor:pointer;padding:0;
    min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .addrow{width:100%;margin-top:8px;padding:10px;background:var(--paper);border:1px dashed var(--rule);
    font:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer}
  .row{display:flex;gap:8px;margin-top:10px}
  label.f{display:block;margin-top:14px;font-size:13.5px;color:var(--ink-soft)}
  label.f input{margin-top:5px}
  input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);width:100%;border-radius:0}
  .toggle{display:flex;margin-top:10px;border:1px solid var(--rule)}
  .toggle button{flex:1;padding:10px;background:var(--paper);border:0;border-right:1px solid var(--rule);font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .toggle button:last-child{border-right:0}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper-lit)}
  .btn{width:100%;padding:13px;margin-top:12px;background:var(--ink);color:var(--paper-lit);border:0;font:inherit;font-size:16px;cursor:pointer}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.danger{background:var(--debit)}
  .entry{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;gap:8px;min-height:46px}
  .entry > div:last-child{display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
  .entry.open{align-items:flex-start}
  .entry.open > div:last-child{margin-top:2px}
  .entry small{color:var(--muted);display:block;font-size:12px}
  .entry .del{background:none;border:0;color:var(--debit);font-size:20px;cursor:pointer;
    min-width:44px;min-height:44px;padding:0;line-height:1;flex:none;
    display:inline-flex;align-items:center;justify-content:center;margin-right:-8px}
  .eleft{min-width:0;flex:1}
  .entry .ebody{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 0;
    margin:0;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}
  .entry .ebody .ename{margin-right:2px}
  .entry.open .ebody .ename{text-decoration:underline;text-underline-offset:3px}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
  .entry .act{background:var(--paper);border:1px solid var(--ink-soft);color:var(--ink-soft);
    font:inherit;font-size:13px;padding:0 12px;min-height:40px;cursor:pointer;
    display:inline-flex;align-items:center}
  .entry .act:hover{background:var(--ink);color:var(--paper-lit);border-color:var(--ink)}
  .pill.pill-ok{border-color:var(--credit);color:var(--credit)}
  .flag{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:0 2px;min-height:44px;
    background:none;border:0;font:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer;text-align:left}
  .flag .box{width:18px;height:18px;border:1.5px solid var(--ink-soft);flex:none;display:inline-block;position:relative}
  .flag[aria-pressed="true"]{color:var(--ink)}
  .flag[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
  .flag[aria-pressed="true"] .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid var(--paper-lit);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .pill{display:inline-block;border:1px solid var(--amber);color:var(--amber);font-size:10.5px;padding:0 5px;margin-left:5px;vertical-align:1px}
  .entry .mark{display:inline-flex;align-items:center;justify-content:center;
    margin:6px 0 0;padding:0 13px;min-width:0;min-height:40px;background:var(--paper);
    border:1px solid var(--ink-soft);color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer}
  .entry button.mark:hover{background:var(--ink);color:var(--paper-lit);border-color:var(--ink)}
  textarea.code{margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;line-height:1.35;resize:vertical;word-break:break-all}
  .empty{color:var(--muted);font-size:14px;padding:10px 0}
  .note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
  .foot button{background:none;border:0;color:var(--debit);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}

  .chat-log{flex:1;overflow-y:auto;margin:0 -16px;padding:0 16px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.you{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--paper-lit);padding:9px 12px}
  .msg.led{align-self:flex-start;max-width:92%;border-left:2px solid var(--rule);padding:1px 0 1px 11px;color:var(--ink)}
  .msg.led.thinking{color:var(--muted);font-style:italic}
  .msg.led.err{border-left-color:var(--debit);color:var(--debit)}
  .posted{margin-top:9px;border:1px solid var(--rule-soft);background:var(--paper);padding:8px 10px;font-size:12.5px;color:var(--ink-soft)}
  .posted div{padding:1px 0}
  .posted .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .posted button{background:none;border:0;padding:4px 0 0;font:inherit;font-size:12.5px;color:var(--debit);text-decoration:underline;cursor:pointer}
  .chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
  .chat-chips button{background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);font:inherit;font-size:12.5px;padding:6px 9px;cursor:pointer}
  .chat-form{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--rule);margin:0 -16px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper-lit)}
  .chat-form textarea{flex:1;resize:none;height:44px;max-height:120px;line-height:1.35;padding:11px 10px}
  .chat-form button{background:var(--ink);color:var(--paper-lit);border:0;font:inherit;font-size:14px;padding:12px 15px;cursor:pointer;white-space:nowrap}
  .chat-form button.stop{background:var(--debit)}

  @media (prefers-reduced-motion:no-preference){.sheet.on{animation:up .18s ease-out}}
  @keyframes up{from{transform:translateY(14px)}to{transform:translateY(0)}}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>

<div id="app" class="loading">Loading your ledger…</div>

<div class="askbar">
  <button id="askBtn">Ask the ledger <span>money questions, calendar edits →</span></button>
</div>

<div class="tip" id="tip" aria-hidden="true"></div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="sheet chat" id="chatSheet" role="dialog" aria-modal="true" aria-label="Ask the ledger"></div>

<script>
const KEY = 'wilson-budget-sept2026';
const DOC = 'budget/sept2026';

const PLANS = {
  comfortable: { food:437, save:100, skip:[] },
  aggressive:  { food:337, save:200, skip:[1,3] }
};
const MEALS = {
  canes:  { name:"Cane's",     cost:13.63 },
  cfa:    { name:'CFA Frisco', cost:12.81 },
  cfaUNT: { name:'CFA campus', cost:14.97 },
  mcd:    { name:"McDonald's", cost:11.36 },
  sonic:  { name:'Sonic',      cost:6.00  }
};
const DOWNAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHNAMES = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

/* ---- a month is a key like "2026-09"; everything about it is derived ---- */
function ymOf(y,m){ return y + '-' + String(m+1).padStart(2,'0'); }
function partsOf(k){ const a = String(k).split('-'); return {y:+a[0], m:(+a[1])-1}; }
function monthName(k){ const p = partsOf(k); return MONTHNAMES[p.m] + ' ' + p.y; }
function shortMonth(k){ return MONTHNAMES[partsOf(k).m].slice(0,3); }
function daysIn(k){ const p = partsOf(k); return new Date(p.y, p.m+1, 0).getDate(); }
function firstDowOf(k){ const p = partsOf(k); return new Date(p.y, p.m, 1).getDay(); }
function shiftMonth(k, n){
  const p = partsOf(k), d = new Date(p.y, p.m + n, 1);
  return ymOf(d.getFullYear(), d.getMonth());
}

const SEED_SCHED = [
  {id:'s-apple',  day:1,  label:'Apple Music',        amt:6.99,  kind:'sub'},
  {id:'s-yt',     day:5,  label:'YouTube',            amt:15.99, kind:'sub'},
  {id:'s-capcut', day:5,  label:'CapCut',             amt:10,    kind:'sub'},
  {id:'s-gpt',    day:8,  label:'ChatGPT',            amt:8.51,  kind:'sub'},
  {id:'s-claude', day:14, label:'Claude',             amt:20,    kind:'sub'},
  {id:'b-pp1',    day:10, label:'PayPal installment', amt:57.55, kind:'bill'},
  {id:'b-pp2',    day:24, label:'PayPal installment', amt:57.55, kind:'bill'}
];

const SEED_INCOME = [
  {id:'i-gift', day:1,  label:"Mom's gift",    amt:500},
  {id:'i-pay1', day:11, label:'Lids paycheck', amt:170},
  {id:'i-pay2', day:25, label:'Lids paycheck', amt:170}
];
const SEED_QUICK = Object.keys(MEALS).map((k,n)=>
  ({id:'q-'+k, name:MEALS[k].name, amt:MEALS[k].cost, cat:'food', dir:'out'}));

const CATS = [
  {id:'food',  label:'Fast food',      color:'#A83220'},
  {id:'subs',  label:'Subscriptions',  color:'#C98A22'},
  {id:'games', label:'Games',          color:'#2C6B4C'},
  {id:'bills', label:'Installment',    color:'#7A5230'},
  {id:'extras',label:'Everything else',color:'#4A6B7A'}
];
const FOOD_ONLY_BUDGET = {games:0, extras:100};

const now = new Date();
const THIS_MONTH = ymOf(now.getFullYear(), now.getMonth());

/* which day of a month counts as today: the real date in the month we are
   living in, past the end of one already gone, before the start of one still
   to come. Every is-this-future question downstream reads from it. */
function todayNFor(k){
  if(k === THIS_MONTH) return now.getDate();
  return k < THIS_MONTH ? daysIn(k) + 1 : 0;
}

function blankMonth(){
  return { balance:0, balanceDay:0, carry:false, autoMeals:true,
           income:[], sched:[], purchases:[] };
}

/* everything saved: the months, plus the settings that are not monthly */
let store = {
  v: 2,
  months: {},
  quick: SEED_QUICK.map(s=>Object.assign({},s)),
  plan: 'comfortable',
  cushion: null
};

/* the month on screen. state, DAYS, FIRST_DOW and todayN always describe it,
   so the rest of the page reads them without knowing months exist. */
let view = THIS_MONTH, state = blankMonth(), DAYS = 30, FIRST_DOW = 2, todayN = 0;

function setView(k){
  view = k;
  state = ensureMonth(k);
  DAYS = daysIn(k);
  FIRST_DOW = firstDowOf(k);
  todayN = todayNFor(k);
}

/* A month opened for the first time is born from the one before it: what
   repeats — subscriptions, installments, paydays — comes across, what you
   bought does not, and it opens on whatever the month before finishes with. */
function ensureMonth(k){
  if(store.months[k]) return store.months[k];
  const m = blankMonth();
  const prev = store.months[shiftMonth(k,-1)];
  const dim = daysIn(k);
  if(prev){
    m.sched  = prev.sched.map(x=>({id:newId(), day:Math.min(x.day,dim), label:x.label, amt:x.amt, kind:x.kind}));
    m.income = prev.income.map(x=>({id:newId(), day:Math.min(x.day,dim), label:x.label, amt:x.amt}));
    m.autoMeals = prev.autoMeals;
    m.carry = true;                     // its opening balance follows the month before
  } else {
    m.sched  = SEED_SCHED.map(x=>Object.assign({},x));
    m.income = SEED_INCOME.map(x=>Object.assign({},x));
  }
  store.months[k] = m;
  return m;
}
function monthKeys(){ return Object.keys(store.months).sort(); }

let openDay = null, addDir = 'out', addWhen = 'spent', schedKind = 'sub', quickEdit = false;
let resetArmed = false, bkArmed = false;   // in-page "are you sure", one tap to arm
let openEntry = null;   // the logged entry whose options are showing
let addFlag = false;    // the next thing logged is paid back (out) or a payback (in)

/* ---------- storage: Claude's artifact store, else this browser ---------- */
let saveMode = 'none', lastSaved = null, dbDoc = null, writing = false, localOk = false;
let wTimer = null, wQueued = false, wBusy = false, wFailed = false;
let syncedAt = null, cameFromAway = false;

function boot(){
  // read this browser first so the page is never sitting blank
  try{
    const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    localOk = true; saveMode='local';
    const v = localStorage.getItem(KEY);
    if(v) adopt(JSON.parse(v));
  }catch(e){ localOk = false; saveMode='none'; }
  setView(view);
  render();
  // saved to disk and opened on its own, there is no Claude to ask
  if(!(window.claude && typeof window.claude.use === 'function')){
    const tag = document.querySelector('.askbar button span');
    if(tag) tag.textContent = 'open this copy in Claude to ask →';
  }
  connect();
}

// upgrade to Claude's store if this page is open inside Claude
async function connect(){
  let cap = null;
  try{
    if (window.claude && typeof window.claude.use === 'function') cap = await window.claude.use('db');
  }catch(e){ cap = null; }
  if(!cap) return;
  try{
    const doc = cap.doc(DOC);
    const snap = await withTimeout(doc.get(), 10000);
    dbDoc = doc; saveMode = 'cloud';

    /* Two copies of the same ledger, one in this browser and one in your
       Claude account. Whichever was written last is the real one. A device
       that has never saved always takes the account's copy, so a phone
       opening the link for the first time inherits the laptop rather than
       pushing an empty month over it. */
    const mine = +store.updatedAt || 0;
    if(!snap || !snap.exists){
      save();                                   // nothing up there yet — send this one
    } else if(mine === 0 || (+snap.data().updatedAt || 0) >= mine){
      adopt(snap.data());
      syncedAt = new Date(); cameFromAway = true;
    } else {
      save();                                   // this device is ahead
    }
    render();

    doc.onSnapshot(s=>{
      if (!s || !s.exists) return;
      if (s.metadata && s.metadata.hasPendingWrites) return;   // our own write, echoed back
      if (wQueued || wBusy || writing) return;                 // our edits are not saved yet
      const d = s.data();
      if ((+d.updatedAt || 0) <= (+store.updatedAt || 0)) return;   // not newer than ours
      if (JSON.stringify(d) === JSON.stringify(strip(store))) return;
      adopt(d);
      syncedAt = new Date(); cameFromAway = true;
      render();
      if(openDay != null) drawSheet();           // a sheet open over it must not go stale
    }, ()=>{});
  }catch(e){ writing = false; dbDoc = null; }
}

/* Takes anything this ledger has ever saved — the first single-month shape,
   the one after it, or the current store of months — and leaves store sound. */
function adopt(raw){
  if(!raw || typeof raw !== 'object') return;
  // Everything the account delivers is frozen, and editing a frozen object in
  // place either does nothing or throws — so the ledger never holds what it was
  // handed, only its own copy of it.
  raw = JSON.parse(JSON.stringify(raw));
  // and it remembers how new the copy it took is, or it would treat every copy
  // it hears about afterwards as newer than its own
  store.updatedAt = +raw.updatedAt || 0;

  const incoming = (raw.v >= 2 && raw.months && typeof raw.months === 'object')
    ? raw
    : { months:{ '2026-09': oneMonthFrom(raw) }, quick: raw.quick, plan: raw.plan, cushion: raw.cushion };

  store.months = (incoming.months && typeof incoming.months === 'object') ? incoming.months : {};
  if(Array.isArray(incoming.quick) && incoming.quick.length) store.quick = incoming.quick;
  if(incoming.plan === 'comfortable' || incoming.plan === 'aggressive') store.plan = incoming.plan;
  if(incoming.cushion === null || isFinite(+incoming.cushion)) store.cushion = incoming.cushion;
  store.v = 2;

  store.quick.forEach(x=>{ x.amt=Math.abs(+x.amt)||0; x.dir = x.dir==='in'?'in':'out';
    if(x.dir==='out' && !catOk(x.cat)) x.cat='extras'; });

  Object.keys(store.months).forEach(k=>{
    if(!/^\d{4}-\d{2}$/.test(k)){ delete store.months[k]; return; }
    const m = Object.assign(blankMonth(), store.months[k]);
    const dim = daysIn(k), day = d=>{ d=parseInt(d,10); return isFinite(d)?Math.min(dim,Math.max(1,d)):1; };
    if(!Array.isArray(m.sched)) m.sched = [];
    if(!Array.isArray(m.income)) m.income = [];
    if(!Array.isArray(m.purchases)) m.purchases = [];
    m.balance = +m.balance || 0;
    m.balanceDay = Math.min(dim, Math.max(0, parseInt(m.balanceDay,10) || 0));
    m.carry = m.carry === true;
    m.autoMeals = m.autoMeals !== false;
    m.sched.forEach(x=>{ x.day=day(x.day); x.amt=Math.abs(+x.amt)||0; x.kind = x.kind==='bill'?'bill':'sub'; });
    m.income.forEach(x=>{ x.day=day(x.day); x.amt=Math.abs(+x.amt)||0; x.label=String(x.label||'Money in'); });
    m.purchases.forEach(p=>{
      p.day=day(p.day); p.amt=Math.abs(+p.amt)||0;
      p.dir = p.dir==='in' ? 'in' : 'out';
      if(p.dir==='out' && !catOk(p.cat)) p.cat='extras';
      if(p.dir==='in'){ delete p.back; if(p.payback !== true) delete p.payback; }
      else { delete p.payback; if(p.back!=='owed' && p.back!=='paid') delete p.back; }
    });
    store.months[k] = m;
  });
  setView(view);
}

/* the first save shape — one month, unnamed — read as September 2026 */
function oneMonthFrom(raw){
  const m = blankMonth();
  const opening = raw.startBalance !== undefined && raw.balance === undefined;
  m.balance = +(opening ? raw.startBalance : raw.balance) || 0;
  m.balanceDay = opening ? 0 : Math.max(0, parseInt(raw.balanceDay,10) || 0);
  m.autoMeals = raw.autoMeals !== false;
  m.purchases = Array.isArray(raw.purchases) ? raw.purchases : [];
  m.sched = Array.isArray(raw.sched) && raw.sched.length
    ? raw.sched : SEED_SCHED.map(x=>Object.assign({},x));

  if(Array.isArray(raw.income) && raw.income.length) m.income = raw.income;
  else {
    // older still: one gift figure, and paydays that all shared one amount
    const inc = [];
    if(+raw.gift) inc.push({id:'i-gift', day:Math.max(1,parseInt(raw.giftDay,10)||1), label:"Mom's gift", amt:Math.abs(+raw.gift)});
    (Array.isArray(raw.payDays)?raw.payDays:[]).forEach((d,n)=>
      inc.push({id:'i-pay'+(n+1), day:Math.max(1,parseInt(d,10)||1), label:'Lids paycheck', amt:Math.abs(+raw.paycheck)||0}));
    m.income = inc.length ? inc : SEED_INCOME.map(x=>Object.assign({},x));
  }
  return m;
}
function strip(s){ return JSON.parse(JSON.stringify(s)); }

/* Saving never blocks the screen. Callers change state, call save(), and
   render immediately; the write is coalesced and runs on its own. A store
   that hangs can slow the save, never the app. */
function save(){
  wQueued = true;
  if(wTimer) return;
  wTimer = setTimeout(flush, 100);
}
function withTimeout(pr, ms){
  return Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error('storage timed out')), ms))]);
}
async function flush(){
  wTimer = null;
  if(wBusy){ save(); return; }        // a write is in flight; try again after it
  if(!wQueued) return;
  wQueued = false; wBusy = true;
  // strictly ahead of whatever we last adopted, so a device whose clock runs
  // behind cannot write a save that another device reads as older and ignores
  store.updatedAt = Math.max(Date.now(), (+store.updatedAt || 0) + 1);
  const payload = strip(store);
  let landed = false;
  if(localOk){
    try{ localStorage.setItem(KEY, JSON.stringify(payload)); landed = true; }catch(e){}
  }
  try{
    if(saveMode==='cloud' && dbDoc){
      writing = true;
      await withTimeout(dbDoc.set(payload), 10000);
    } else if(!landed){
      throw new Error('no storage available');
    }
    lastSaved = new Date(); wFailed = false;
    if(saveMode==='cloud' && dbDoc){ syncedAt = lastSaved; cameFromAway = false; }
  }catch(e){
    console.error('Could not save', e);
    wFailed = true;
  }finally{
    writing = false; wBusy = false;
    flagSave();
    if(wQueued) save();
  }
}
function flagSave(){
  const el = document.getElementById('saveState');
  if(!el) return;
  if(wFailed && localOk){
    el.textContent = "Saved on this device only — Claude's storage isn't answering.";
    el.style.color = 'var(--amber)';
  } else if(wFailed || saveMode==='none'){
    el.textContent = "Not saving — storage is blocked here. Your entries will vanish when you close the tab.";
    el.style.color = 'var(--debit)';
  } else if(saveMode === 'cloud'){
    const t = (syncedAt || lastSaved);
    el.textContent = 'Synced to your Claude account'
      + (t ? ' · ' + (cameFromAway ? 'picked up a change from another device at ' : 'saved ')
            + t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '')
      + '. Open this same link on your phone to carry on there.';
    el.style.color = 'var(--credit)';
  } else if(lastSaved){
    el.textContent = 'Saved on this device only — this copy does not sync. '
      + 'Saved ' + lastSaved.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) + '.';
    el.style.color = 'var(--amber)';
  } else {
    el.textContent = 'Saved on this device only — this copy does not sync.';
    el.style.color = 'var(--muted)';
  }
}

/* ---------------------------- the numbers ---------------------------- */
function money(n){ return (n<0?'−$':'$') + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ return (n<0?'−$':'$') + Math.round(Math.abs(n)).toLocaleString('en-US'); }
function ord(d){ const s=['th','st','nd','rd'], v=d%100; return d+(s[(v-20)%10]||s[v]||s[0]); }
function clampDay(d){ d = parseInt(d,10); return isFinite(d) ? Math.min(DAYS, Math.max(1,d)) : 1; }
function catOk(c){ return CATS.some(x=>x.id===c); }
function newId(){ return String(Date.now().toString(36)) + Math.random().toString(36).slice(2,6); }

function anchorDay(){ return state.carry ? 0 : Math.min(DAYS, Math.max(0, parseInt(state.balanceDay,10) || 0)); }
function cushion(){ return store.cushion==null ? PLANS[store.plan].save : Math.abs(+store.cushion)||0; }
function isFuture(d){ return d >= todayN; }

/* ---- the chain between months ----
   A month that carries opens on whatever the month before it finishes with, so
   a purchase logged in September moves October's whole forecast. Months that do
   not carry sit on the balance you typed. Walked with the month's own calendar,
   never the one on screen. */
function openingOf(k, seen){
  const m = store.months[k];
  if(!m) return 0;
  const prevK = shiftMonth(k,-1);
  if(m.carry && store.months[prevK] && !(seen && seen[prevK])) return closingOf(prevK, seen);
  return +m.balance || 0;
}
function closingOf(k, seen){
  const m = store.months[k];
  if(!m) return 0;
  seen = Object.assign({}, seen); seen[k] = 1;
  const dim = daysIn(k), tN = todayNFor(k), fd = firstDowOf(k);
  let bal = openingOf(k, seen);
  const anchor = m.carry ? 0 : Math.min(dim, Math.max(0, parseInt(m.balanceDay,10) || 0));
  for(let d = Math.max(1,anchor); d<=dim; d++) bal += netOf(m, d, false, tN, fd, dim);
  return bal;
}

/* one day's net, for any month — the pure form the view wrappers below call */
function mealOf(day, fd){
  const dow = (fd + day - 1) % 7;
  if(PLANS[store.plan].skip.includes(dow)) return null;
  if(dow === 2) return MEALS.cfaUNT;
  return (day % 2 === 0) ? MEALS.canes : MEALS.cfa;
}
function autoMealOf(m, d, tN, fd){
  if(!m.autoMeals || d < tN) return 0;
  if(m.purchases.some(x=>x.day===d && x.cat==='food' && x.dir!=='in')) return 0;
  const meal = mealOf(d, fd);
  return meal ? meal.cost : 0;
}
function netOf(m, d, real, tN, fd, dim){
  let n = 0;
  m.income.forEach(i=>{ if(i.day===d) n += i.amt; });
  m.sched.forEach(x=>{ if(x.day===d) n -= x.amt; });
  m.purchases.forEach(p=>{
    if(p.day!==d || (real && p.planned)) return;
    n += p.dir==='in' ? p.amt : -p.amt;
  });
  if(!real){
    n -= autoMealOf(m, d, tN, fd);
    // money someone owes you back is expected by the end of the month — never
    // in the real balance until it actually lands and is logged
    if(d === dim) m.purchases.forEach(p=>{ if(p.dir!=='in' && p.back==='owed') n += p.amt; });
  }
  return n;
}
function schedOn(d){ return state.sched.filter(x=>x.day===d); }
function incomeOn(d){ return state.income.filter(x=>x.day===d); }
function dayPurchases(d){ return state.purchases.filter(x=>x.day===d); }
function isIn(p){ return p.dir === 'in'; }
/* A purchase someone is paying you back for is not your spending, and their
   repayment is not your income. Both still move the real balance. */
function isMine(p){ return !isIn(p) && !p.back; }
function owedList(){
  // a plan whose day went by without happening is not owed to anyone
  return state.purchases.filter(p=> !isIn(p) && p.back==='owed'
    && !(p.planned && todayN >= 1 && p.day < todayN));
}
function owedBack(){ return owedList().reduce((s,p)=>s+p.amt,0); }
function paidBack(){ return state.purchases.filter(p=> !isIn(p) && p.back==='paid').reduce((s,p)=>s+p.amt,0); }
function catLabel(id){ const c = CATS.find(x=>x.id===id); return c ? c.label : 'Money in'; }
function incomeTotal(){ return state.income.reduce((s,x)=>s+x.amt,0); }

function plannedMeal(day){ return mealOf(day, FIRST_DOW); }
function autoMealFor(d){ return autoMealOf(state, d, todayN, FIRST_DOW); }

/* net change on one day. real=true counts only what has actually happened:
   no assumed meals, no purchases you have merely planned. */
function netFor(d, real){ return netOf(state, d, real, todayN, FIRST_DOW, DAYS); }

/* what this month opens on, whether carried or typed */
function opening(){ return state.carry ? openingOf(view) : (+state.balance || 0); }

/* balance at the end of every day, anchored on the balance you recorded
   (which is read as the start of its day) and walked both directions */
function forecast(){
  const rows = new Array(DAYS).fill(0);
  const a = Math.max(1, anchorDay());
  const open = opening();
  let bal = open;
  for(let d=a; d<=DAYS; d++){ bal += netFor(d,false); rows[d-1] = bal; }
  bal = open;
  for(let d=a-1; d>=1; d--){ rows[d-1] = bal; bal -= netFor(d,false); }
  return rows;
}

/* what is in the account at this moment */
function balanceNow(){
  if(todayN < 1) return opening();
  let bal = opening();
  for(let d=Math.max(1,anchorDay()); d<=Math.min(todayN,DAYS); d++) bal += netFor(d,true);
  return bal;
}

/* what is free to spend, per day, across the days that are left */
function allowance(){
  const t = Math.max(1, Math.min(todayN||1, DAYS));
  const started = todayN >= 1;
  const daysLeft = Math.max(1, DAYS - t + 1);
  let incoming = 0, fixed = 0, earmarked = 0;

  if(started) dayPurchases(t).forEach(p=>{ if(p.planned) (isIn(p) ? incoming += p.amt : earmarked += p.amt); });
  for(let d = started ? t+1 : 1; d<=DAYS; d++){
    incomeOn(d).forEach(i=> incoming += i.amt);
    schedOn(d).forEach(s=> fixed += s.amt);
    dayPurchases(d).forEach(p=> isIn(p) ? incoming += p.amt : earmarked += p.amt);
  }
  const owed = owedBack();
  incoming += owed;
  const free = balanceNow() + incoming - fixed - earmarked - cushion();
  return { perDay: free/daysLeft, free, daysLeft, incoming, fixed, earmarked, owed, target:cushion() };
}
function spentToday(){
  if(todayN<1 || todayN>DAYS) return 0;
  return dayPurchases(todayN).filter(p=>!p.planned && isMine(p)).reduce((s,p)=>s+p.amt,0);
}
function earnedToday(){
  if(todayN<1 || todayN>DAYS) return 0;
  return dayPurchases(todayN).filter(p=>!p.planned && isIn(p) && !p.payback).reduce((s,p)=>s+p.amt,0)
       + incomeOn(todayN).reduce((s,i)=>s+i.amt,0);
}
function schedTotal(kind, pastOnly){
  return state.sched.filter(x=>x.kind===kind && (!pastOnly || x.day <= (todayN||0)))
                    .reduce((s,x)=>s+x.amt,0);
}
function spentBy(c){
  let s = state.purchases.filter(x=>x.cat===c && !x.planned && isMine(x)).reduce((a,x)=>a+x.amt,0);
  if(c==='subs')  s += schedTotal('sub', true);
  if(c==='bills') s += schedTotal('bill', true);
  return s;
}
function budgetFor(c){
  if(c==='food')  return PLANS[store.plan].food;
  if(c==='subs')  return schedTotal('sub', false);
  if(c==='bills') return schedTotal('bill', false);
  return FOOD_ONLY_BUDGET[c] || 0;
}
function totalSpent(){ return state.purchases.filter(x=>!x.planned && isMine(x)).reduce((s,x)=>s+x.amt,0) + schedTotal('sub',true) + schedTotal('bill',true); }
function totalIn(){
  return state.purchases.filter(x=>!x.planned && isIn(x) && !x.payback).reduce((s,x)=>s+x.amt,0)
       + state.income.filter(i=>i.day <= (todayN||0)).reduce((s,i)=>s+i.amt,0);
}

function entryTags(p){
  const t = [];
  if(p.planned) t.push(isIn(p) ? 'expected' : 'planned');
  if(p.back==='owed') t.push('owed back');
  if(p.back==='paid') t.push('paid back');
  if(p.payback) t.push('payback');
  return t;
}

/* every line that lands on one day, for the hover card */
function dayLines(d){
  const out = [];
  incomeOn(d).forEach(i=> out.push({t:i.label, a:i.amt}));
  schedOn(d).forEach(s=> out.push({t:s.label, a:-s.amt, q:s.kind==='bill'?'installment':'subscription'}));
  dayPurchases(d).forEach(p=> out.push({t:p.name, a: isIn(p) ? p.amt : -p.amt,
    q: entryTags(p).join(' · ') || null}));
  const am = autoMealFor(d);
  if(am){ const m = plannedMeal(d); out.push({t:m.name, a:-am, q:'assumed'}); }
  if(d === DAYS) state.purchases.forEach(p=>{
    if(!isIn(p) && p.back==='owed') out.push({t:'Back for '+p.name, a:p.amt, q:'owed, expected'}); });
  return out;
}

/* ------------------------------ the page ------------------------------ */
function render(){
  resetArmed = false;        // a redraw takes back an armed delete
  const fc = forecast();
  const endBal = fc[DAYS-1];
  const lowest = Math.min.apply(null, fc);
  const lowDay = fc.indexOf(lowest)+1;
  const now$ = balanceNow();
  const al = allowance();
  const today$ = spentToday();
  const income = opening() + incomeTotal();
  const phase = view === THIS_MONTH ? 'now' : (view < THIS_MONTH ? 'past' : 'ahead');
  const prevK = shiftMonth(view,-1), nextK = shiftMonth(view,1);

  let bar='';
  CATS.forEach(c=>{
    const w = Math.min(100,(spentBy(c.id)/Math.max(income,1))*100);
    if(w>0) bar += '<span style="width:'+w+'%;background:'+c.color+'"></span>';
  });

  let warn = '';
  if(phase === 'past') warn = '';
  else if(now$ < 0)
    warn = '<div class="warn">Your account is showing '+money(now$)+'. Nothing else should go out until money lands.</div>';
  else if(al.perDay < 0)
    warn = '<div class="warn">There is no room left: what is already committed for the rest of September runs '+money(-al.free)+' past what you have. Cut something planned, or lower the cushion.</div>';
  else if(lowest < 0)
    warn = '<div class="warn">This plan runs you dry around the '+ord(lowDay)+' — projected '+money(lowest)+'. Move something later or spend less before then.</div>';
  else if(endBal < al.target)
    warn = '<div class="warn">You would finish with '+money(endBal)+', short of your '+money0(al.target)+' cushion by '+money(al.target-endBal)+'.</div>';

  let cal='';
  for(let i=0;i<FIRST_DOW;i++) cal += '<div class="day blank"></div>';
  for(let d=1; d<=DAYS; d++){
    const pur = dayPurchases(d);
    const dayOut = pur.filter(x=>!isIn(x)).reduce((s,x)=>s+x.amt,0) + autoMealFor(d);
    const dayIn  = pur.filter(isIn).reduce((s,x)=>s+x.amt,0);
    const meal = plannedMeal(d);
    let marks='';
    if(schedOn(d).some(s=>s.kind==='sub'))  marks += '<i class="m-sub"></i>';
    if(schedOn(d).some(s=>s.kind==='bill')) marks += '<i class="m-bill"></i>';
    if(incomeOn(d).length || dayIn > 0) marks += '<i class="m-pay"></i>';
    const b = fc[d-1];
    // what this day does to the money, all in: money out reads negative, a gain reads +.
    // it is the same figure the running balance below steps by.
    const net = netFor(d,false);
    const moved = dayIn || dayOut || schedOn(d).length || incomeOn(d).length;
    const netCls = net > 0 ? 'earned' : net < 0 ? 'spent' : 'planned';
    const fig = moved ? '<span class="'+netCls+'">'+(net>0?'+':'')+money0(net)+'</span>' : '';
    cal += '<button class="day'+(todayN===d?' today':'')+(todayN&&d<todayN?' past':'')+(b<0?' neg':'')+'" data-day="'+d+'">'
      + '<span class="n">'+d+'</span>'
      + '<span class="marks">'+marks+'</span>'
      + (fig || (meal ? '<span class="planned">'+esc(meal.name.split(' ')[0])+'</span>' : ''))
      + '<span class="bal'+(b<0?' neg':'')+'">'+money0(b)+'</span></button>';
  }

  let cats='';
  CATS.forEach(c=>{
    const s = spentBy(c.id), bd = budgetFor(c.id);

function plural(n,one,many){ return n+' '+(n===1?one:many); }

/* opening a month you have never opened creates it, so a first visit to
   October is a save as well as a render */
function goMonth(k){
  const fresh = !store.months[k];
  hideTip(); closeSheet();
  setView(k);
  if(fresh) save();
  render();
  window.scrollTo({top:0, behavior:'auto'});
}
const canHover = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
let tipFor = null;   // the day cell the card is pinned to

function showTip(el, d){
  const tip = document.getElementById('tip');
  const lines = dayLines(d), net = netFor(d,false), bal = forecast()[d-1];
  let h = '<div class="tip-h">'+DOWNAMES[(FIRST_DOW+d-1)%7]+' the '+ord(d)+'</div>';
  h += lines.length
    ? lines.map(l=>'<div class="tip-r"><span>'+esc(l.t)+(l.q?' <em>'+l.q+'</em>':'')+'</span>'
        + '<b class="'+(l.a<0?'neg':'pos')+'">'+(l.a>0?'+':'')+money(l.a)+'</b></div>').join('')
    : '<div class="tip-e">Nothing on this day</div>';
  if(lines.length > 1)
    h += '<div class="tip-r tip-net"><span>The day</span><b class="'+(net<0?'neg':'pos')+'">'
       + (net>0?'+':'')+money(net)+'</b></div>';
  h += '<div class="tip-r tip-f'+(lines.length>1?'':' tip-net')+'"><span>Left after</span><b>'+money(bal)+'</b></div>';
  tip.innerHTML = h;
  tip.classList.add('on');
  tipFor = el;
  placeTip();
}
/* sit above the day when there is room, otherwise below; never off the edge */
function placeTip(){
  const tip = document.getElementById('tip');
  if(!tipFor || !tip || !tip.classList.contains('on')) return;
  const r = tipFor.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 8));
  const top  = r.top - hh - 8 < 8 ? r.bottom + 8 : r.top - hh - 8;
  tip.style.left = left + 'px';
  tip.style.top  = top + 'px';
}
function hideTip(){
  tipFor = null;
  const t = document.getElementById('tip');
  if(t) t.classList.remove('on');
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function incRow(i){
  return '<div class="inc-row" data-inc="'+i.id+'">'

    + '<button data-delinc="'+i.id+'" aria-label="Remove">×</button></div>';
}
/* pull whatever is typed in the income rows back into state before redrawing */
function readIncome(){
  document.querySelectorAll('.inc-row').forEach(r=>{
    const it = state.income.find(x=>x.id===r.dataset.inc);
    if(!it) return;
    it.day   = clampDay(r.querySelector('[data-f="day"]').value);
    it.label = r.querySelector('[data-f="label"]').value.trim().slice(0,32) || 'Money in';
    it.amt   = Math.abs(parseFloat(r.querySelector('[data-f="amt"]').value)) || 0;
  });
}

/* Every copy of this ledger — the one in Claude, the file on your disk —
   keeps its own books. This is how a month of entries moves between them. */
function ledgerSummary(){
  const ks = monthKeys();
  const n = ks.reduce((t,k)=>t + store.months[k].purchases.length, 0);
  return ks.length ? plural(ks.length,'month','months') + ' · ' + plural(n,'entry','entries')
                     + ' · ' + ks.map(shortMonth).join(', ')
                   : 'nothing saved yet';
}
function openBackup(){
  openDay = null; bkArmed = false;
  const text = JSON.stringify(store);
  document.getElementById('sheet').innerHTML =

        ? 'This ledger already syncs: it is kept in your Claude account, so opening this same link on your phone '
          + 'shows everything you have logged here, and changes on either one reach the other. The text below is a '
          + 'backup on top of that — worth keeping somewhere safe.'
        : 'This copy saves only to this browser, so it does not reach your phone. The text below is your whole '
          + 'ledger — copy it, then paste it into the Claude link on the device you want it on.')
    + '</div>'
    + '<textarea id="bkOut" class="code" rows="4" readonly aria-label="Your ledger as text">'+esc(text)+'</textarea>'
    + '<button class="btn" id="bkCopy">Copy it</button>'
    + '<div class="note" id="bkMsg"></div>'

    + '<h3 style="font-size:15px;margin:22px 0 0">Bring one in</h3>'
    + '<div class="note" style="margin-top:4px">Paste a backup here to load it. It replaces what is on this '
    + 'copy, and it understands backups from every older version of this ledger.</div>'
    + '<textarea id="bkIn" class="code" rows="4" placeholder="Paste a backup here" aria-label="Paste a backup"></textarea>'
    + '<button class="btn" id="bkLoad">Load it</button>'
    + '<div class="note" id="bkErr" style="color:var(--debit)"></div>';
  showSheet('sheet');
  document.getElementById('close').onclick = closeSheet;

  document.getElementById('bkCopy').onclick = async ()=>{
    const box = document.getElementById('bkOut'), msg = document.getElementById('bkMsg');
    try{
      await navigator.clipboard.writeText(box.value);
      msg.textContent = 'Copied. Paste it into the other copy, or anywhere you want it kept.';
      msg.style.color = 'var(--credit)';
    }catch(e){
      box.focus(); box.select();
      msg.textContent = 'Could not reach the clipboard here — it is selected above, so copy it yourself.';
      msg.style.color = 'var(--amber)';
    }
  };

  document.getElementById('bkIn').oninput = ()=>{
    if(!bkArmed) return;
    bkArmed = false;
    const btn = document.getElementById('bkLoad');
    btn.textContent = 'Load it'; btn.classList.remove('danger');
    document.getElementById('bkErr').textContent = '';
  };
  document.getElementById('bkLoad').onclick = ()=>{
    const err = document.getElementById('bkErr');
    const raw = document.getElementById('bkIn').value.trim();
    err.textContent = '';
    if(!raw){ err.textContent = 'Paste a backup in first.'; return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ err.textContent = 'That is not a backup — it did not read as text this ledger wrote.'; return; }
    const looksRight = parsed && typeof parsed === 'object'
      && (parsed.months || Array.isArray(parsed.purchases) || parsed.balance != null || parsed.startBalance != null);
    if(!looksRight){ err.textContent = 'That read fine but holds no ledger.'; return; }
    const btn = document.getElementById('bkLoad');
    const found = parsed.months
      ? Object.keys(parsed.months).length + ' month' + (Object.keys(parsed.months).length===1?'':'s') + ', '
        + Object.values(parsed.months).reduce((t,m)=>t+((m&&m.purchases||[]).length),0) + ' entries'
      : (parsed.purchases||[]).length + ' entries';
    if(!bkArmed){
      bkArmed = true;
      btn.textContent = 'Tap again to load it';
      btn.classList.add('danger');
      err.textContent = 'That backup holds ' + found + '. Loading it replaces what is on this copy — '
        + ledgerSummary() + '.';
      err.style.color = 'var(--debit)';
      return;
    }
    bkArmed = false;
    store = { v:2, months:{}, quick: SEED_QUICK.map(x=>Object.assign({},x)), plan:'comfortable', cushion:null };
    adopt(parsed);
    save(); closeSheet(); render();
  };
}

function openSheet(day){
  openDay = day; addDir = 'out'; quickEdit = false; openEntry = null; addFlag = false;
  addWhen = isFuture(day) ? 'planned' : 'spent';
  drawSheet();
}
function drawSheet(){
  const day = openDay, fc = forecast();
  const meal = plannedMeal(day);
  const pur = dayPurchases(day);
  const dow = DOWNAMES[(FIRST_DOW+day-1)%7];
  const bal = fc[day-1];

  let sched = '';
  incomeOn(day).forEach(i=> sched += entryRow(i.label,'expected in',i.amt,true,i.id));
  schedOn(day).forEach(s=>
    sched += entryRow(s.label, s.kind==='bill'?'installment':'subscription', s.amt, false, s.id));
  const am = autoMealFor(day);
  if(am) sched += entryRow(meal.name,'assumed meal, not logged',am,false);

  if(day === DAYS) owedList().forEach(p=>
    sched += entryRow('Back for '+p.name, 'owed to you — expected by month end', p.amt, true));

  const logged = pur.length
    ? '<div class="note" style="margin-top:4px">Tap an entry for more — like marking one somebody is paying you back for.</div>'
      + pur.map(entryHtml).join('')
    : '<div class="empty">Nothing logged yet.</div>';

  const isBill = addDir==='bill', isIncome = addDir==='in';
  const tiles = store.quick.filter(q=> isIncome ? q.dir==='in' : q.dir!=='in');
  document.getElementById('sheet').innerHTML =
    '<div class="sheet-head"><div><h2>'+dow+' the '+day+'</h2>'
    + '<div class="sub" style="color:'+(bal<0?'var(--debit)':'var(--muted)')+'">'+money(bal)+' left after this day</div></div>'
    + '<button class="x" id="close" aria-label="Close">×</button></div>'
    + sched
    + '<h3 style="font-size:15px;margin:18px 0 0">Add something</h3>'
    + '<div class="toggle">'
    + '<button data-dir="out" aria-pressed="'+(addDir==='out')+'">Money out</button>'
    + '<button data-dir="in" aria-pressed="'+isIncome+'">Money in</button>'
    + '<button data-dir="bill" aria-pressed="'+isBill+'">Repeats</button></div>'
    + (isBill ? '' : '<div class="toggle">'

/* The repayment lands today, in the month we are living in — which is not
   always the month the purchase was in. A purchase still ahead of us gets it
   on its own day instead. */
function logPayback(x){
  const k = view > THIS_MONTH ? view : THIS_MONTH;
  const m = ensureMonth(k);
  const d = k === THIS_MONTH ? now.getDate() : x.day;
  m.purchases.push({ id:newId(), day:d, name:'Back for '+x.name, amt:x.amt,
    cat:'income', dir:'in', planned:false, payback:true, for:x.id });
  return {k, d};
}

let sampleFn = null, sampleTried = false, canTools = false, toolMax = 0;
let chat = [];          // turns sent to Claude
let bubbles = [];       // what is drawn in the sheet
let pending = [];       // changes made during the turn in flight
let ctl = null, busy = false;

async function ensureSample(){
  if(sampleTried) return sampleFn;
  sampleTried = true;
  try{
    if(!(window.claude && typeof window.claude.use === 'function')) return null;
    sampleFn = await window.claude.use('sample');
    if(sampleFn){
      const lim = await sampleFn.limits().catch(()=>null);
      canTools = !!(lim && lim.tools);
      toolMax = lim && lim.tools && +lim.tools.maxCount || 0;
    }
  }catch(e){ sampleFn = null; }
  return sampleFn;
}

function note(text){ pending.push(text); }
function commit(){ save(); render(); }

/* the whole ledger, in words, sent fresh with every question */
function snapshot(){
  const al = allowance(), fc = forecast();
  const lowest = Math.min.apply(null, fc), lowDay = fc.indexOf(lowest)+1;
  const L = [];
  const ph = view === THIS_MONTH ? 'the month we are in' : (view < THIS_MONTH ? 'a month already finished' : 'a month still ahead');
  L.push('LEDGER — on screen: '+monthName(view)+' ['+view+'], '+DAYS+' days, the 1st is a '+DOWNAMES[FIRST_DOW]+'. This is '+ph+'.');
  L.push('Real today is '+MONTHNAMES[partsOf(THIS_MONTH).m]+' '+now.getDate()+', '+partsOf(THIS_MONTH).y+'.');
  L.push('Months on file: '+monthKeys().map(k=>k+' (ends at '+money(closingOf(k))+')').join(', ')
    + '. open_month moves to any month, including one not on that list — it gets created from the one before it.');
  L.push('This month opens on '+money(opening())+(state.carry ? ', carried from '+monthName(shiftMonth(view,-1)) : ', a figure set here')+'.');
  L.push('In the account right now: '+money(balanceNow())+' (recorded balance '+money(state.balance)+' as of the start of the '+ord(anchorDay()||1)+').');
  L.push('Free to spend: '+money(al.perDay)+' a day across '+al.daysLeft+' days left. That is '+money(al.free)+' loose after '
    + money(al.fixed)+' of bills and subscriptions still to come, '+money(al.incoming)+' of income still to land, '
    + money(al.earmarked)+' already promised to planned purchases, and a '+money(al.target)+' cushion to end the month on.');
  L.push('Projected on the 30th: '+money(fc[DAYS-1])+'. Lowest point: '+money(lowest)+' on the '+ord(lowDay)+'.');
  L.push('Spent today: '+money(spentToday())+'. Spent this month: '+money(totalSpent())+'.');
  L.push('Plan: '+store.plan+' ('+(store.plan==='comfortable'?'7':'5')+' meals a week, '+money0(PLANS[store.plan].food)+' food budget). Assumed meals: '+(state.autoMeals?'on':'off')+'.');
  L.push('Money in this month: '+money(incomeTotal())+' across '+state.income.length+' scheduled lines; '+money(totalIn())+' of it has landed.');
  L.push('');
  L.push('SCHEDULED MONEY IN (id · day · label · amount) — each line holds its own amount:');
  if(!state.income.length) L.push('  none');
  state.income.slice().sort((a,b)=>a.day-b.day).forEach(i=>
    L.push('  '+i.id+' · '+i.day+' · '+i.label+' · +'+money(i.amt)));
  L.push('');
  L.push('REPEATING CHARGES (id · day · label · amount · kind):');
  state.sched.slice().sort((a,b)=>a.day-b.day).forEach(s=>
    L.push('  '+s.id+' · '+s.day+' · '+s.label+' · '+money(s.amt)+' · '+(s.kind==='bill'?'installment':'subscription')));
  L.push('');
  L.push('ONE-OFF ENTRIES (id · day · name · amount · category · direction · real|not yet):');
  if(!state.purchases.length) L.push('  none yet');
  state.purchases.slice().sort((a,b)=>a.day-b.day).forEach(p=>
    L.push('  '+p.id+' · '+p.day+' · '+p.name+' · '+(isIn(p)?'+':'-')+money(p.amt)+' · '+p.cat
      + ' · '+(isIn(p)?'money in':'money out')+' · '+(p.planned?'not yet':'real')
      + (p.back==='owed' ? ' · OWED BACK (not his spending)' : p.back==='paid' ? ' · PAID BACK (not his spending)' : '')
      + (p.payback ? ' · PAYBACK (not income)' : '')));
  if(owedBack() || paidBack())
    L.push('Being paid back this month: '+money(owedBack())+' still owed to him, '+money(paidBack())+' already paid back. '
      + 'None of it counts as his spending; owed money counts as money on its way in.');
  L.push('');
  L.push('QUICK BUTTONS: '+(store.quick.length ? store.quick.map(q=>q.name+' '+(q.dir==='in'?'+':'')+money(q.amt)).join(', ') : 'none')+'.');
  return L.join('\n');
}

function rulesTurn(){
  return 'You are the assistant inside Chris\'s budget ledger, a month-by-month spending app he keeps on his phone. '
  + 'One month is on screen at a time and every other tool acts on that month, so reach for open_month first when he asks about another one. '
  + 'Answer his questions about his money and, when he asks for a change, make it with the tools instead of telling him how.\n\n'
  + 'How to answer: two or three sentences, plain and direct, like a friend who can see the numbers. No headings, no bullet lists '
  + 'unless he asks for a list, no markdown bold. Lead with the number he asked for. Never invent figures — every number you need is below, '
  + 'or comes back from a tool. Dollars to the cent when it matters, rounded when it does not.\n\n'
  + 'Judgement: "can I afford X" means compare X against the free-to-spend-per-day figure and what it does to the balance at the end of the '
  + 'month and the lowest point. Say plainly when something breaks the cushion or runs him negative. If he asks you to change something that '
  + 'would run him dry, make the change he asked for and say what it costs him. A month that carries opens on whatever the month before '
  + 'finishes with, so a change in an earlier month moves every later one — say so when it matters.\n\n'
  + 'Changes: days are numbered within the month on screen. Categories are food, subs, games, bills, extras. Use log_entry for a one-off, money out '
  + 'or money in (direction "in" for a shift he picked up, a gift, something he sold), '
  + 'set_scheduled for a subscription, an installment, or money that lands such as a paycheck (kind "income"), move_entry and '
  + 'remove_entry by the ids listed below, set_money for balance, plan and cushion. Paychecks vary — each income line holds its own '
  + 'amount, so "my check was only 140 this time" means set_scheduled on that one line\'s id, never all of them. '
  + 'Some purchases are really somebody else\'s — usually his mom reimburses him. set_paid_back marks one "owed" so it stops '
  + 'counting as his spending, and "paid" once the money comes back; his mom\'s repayment, logged as money in, should be marked '
  + '"payback" so it does not count as income. He usually logs her repayment himself, so only add the money in when he asks you to. '
  + 'Confirm what you changed in your reply — he sees the calendar update behind this sheet. Ask first only if the request is '
  + 'genuinely ambiguous about which entry or which day.\n\n'
  + snapshot();
}

const CHIPS = [
  'How much can I spend today?',
  'Can I afford a $60 game this week?',
  'Log Cane\'s for today',
  'Move my Claude subscription to the 20th'
];

function buildChat(){
  const sheet = document.getElementById('chatSheet');
  sheet.innerHTML =
    '<div class="sheet-head"><div><h2>Ask the ledger</h2>'
    + '<div class="sub">It can see every number on this page — and change the calendar.</div></div>'
    + '<button class="x" id="chatClose" aria-label="Close">×</button></div>'
    + '<div class="chat-log" id="chatLog"></div>'
    + '<form class="chat-form" id="chatForm">'
    + '<textarea id="chatIn" rows="1" placeholder="Ask about your money…" aria-label="Your question"></textarea>'
    + '<button type="submit" id="chatSend">Ask</button></form>';
  document.getElementById('chatClose').onclick = closeSheet;
  document.getElementById('chatForm').onsubmit = e=>{ e.preventDefault(); busy ? stopChat() : sendChat(); };
  const box = document.getElementById('chatIn');
  box.oninput = ()=>{ box.style.height='44px'; box.style.height=Math.min(120,box.scrollHeight)+'px'; };
  box.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!busy) sendChat(); } };
  paintChat();
}

function paintChat(){
  const log = document.getElementById('chatLog');
  if(!log) return;
  let html = '';
  bubbles.forEach((b,idx)=>{
    if(b.who==='you'){ html += '<div class="msg you">'+esc(b.text)+'</div>'; return; }
    const cls = 'msg led' + (b.thinking?' thinking':'') + (b.err?' err':'');
    html += '<div class="'+cls+'">' + esc(b.thinking ? 'Reading your ledger…' : b.text);
    if(b.changes && b.changes.length){
      html += '<div class="posted"><div class="t">Posted to the ledger</div>'
           + b.changes.map(c=>'<div>· '+esc(c)+'</div>').join('')
           + (b.undo ? '<button data-undo="'+idx+'">Undo these changes</button>' : '<div style="color:var(--muted);padding-top:4px">Undone</div>')
           + '</div>';
    }
    html += '</div>';
  });
  if(!bubbles.length){
    html = '<div class="msg led">Ask me anything about September — what is left, what you can spend today, whether something fits. '
      + 'I can also log a purchase, move a bill, or change your paydays.</div>'
      + '<div class="chat-chips">'+CHIPS.map((c,i)=>'<button data-chip="'+i+'">'+esc(c)+'</button>').join('')+'</div>';
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
  log.querySelectorAll('[data-chip]').forEach(el=> el.onclick = ()=>{
    document.getElementById('chatIn').value = CHIPS[+el.dataset.chip]; sendChat();
  });
  log.querySelectorAll('[data-undo]').forEach(el=> el.onclick = async ()=>{
    const b = bubbles[+el.dataset.undo];
    if(!b || !b.undo) return;
    store = b.undo; b.undo = null;
    setView(store.months[view] ? view : THIS_MONTH);
    save(); render(); paintChat();
  });
}

function errCopy(code){
  switch(code){
    case 'not_granted':    return 'You turned this down, so I cannot read the ledger for you. Reload the page to be asked again.';
    case 'rate_limited':   return 'Too many questions at once — give it a minute and ask again.';
    case 'prompt_too_large': return 'This ledger has grown too big to send in one piece. Clear out some old entries and try again.';
    case 'session_expired': return 'Your Claude session expired. Sign in again and reload.';
    case 'invalid_json':   return 'That answer came back garbled. Ask again.';
    default:               return 'That did not go through. Try asking again.';
  }
}

async function sendChat(){
  if(busy) return;
  const box = document.getElementById('chatIn');
  const q = box.value.trim();
  if(!q) return;
  box.value=''; box.style.height='44px';

  bubbles.push({who:'you', text:q});
  const bub = {who:'ledger', text:'', thinking:true, changes:[]};
  bubbles.push(bub);
  paintChat();

  const s = await ensureSample();
  if(!s){
    bub.thinking=false; bub.err=true;
    bub.text = 'The assistant only runs while this ledger is open inside Claude. Everything else on the page works as usual.';
    paintChat(); return;
  }

  const before = strip(store);
  pending = [];
  busy = true;
  const send = document.getElementById('chatSend');
  send.textContent = 'Stop'; send.classList.add('stop');
  ctl = new AbortController();

  chat.push({role:'user', content:q});
  const turns = [{role:'user', content:rulesTurn()}].concat(chat.slice(-14));
  const opts = { modelTier:'quick', cache:false, signal:ctl.signal,
                 onText:({text})=>{ bub.thinking=false; bub.text=text; paintChat(); } };
  if(canTools) opts.tools = toolMax ? TOOLS.slice(0, toolMax) : TOOLS;

  try{
    const r = await s(turns, opts);
    bub.text = r.text;
    chat.push({role:'assistant', content:r.text});
    if(r.truncated) bub.text += '\n\n(cut short — ask for less at a time)';
  }catch(e){
    if(e && e.code==='cancelled'){
      bub.text = (e.text || '') + (e.text ? '\n\n(stopped)' : 'Stopped.');
    } else {
      bub.text = e && e.text ? e.text + '\n\n' + errCopy(e && e.code) : errCopy(e && e.code);
      bub.err = !(e && e.text);
    }
    chat.pop();
  }
  bub.thinking = false;
  if(pending.length){ bub.changes = pending.slice(); bub.undo = before; }
  pending = [];
  busy = false; ctl = null;
  send.textContent = 'Ask'; send.classList.remove('stop');
  paintChat(); render();
}
function stopChat(){ if(ctl) ctl.abort(); }

document.getElementById('askBtn').onclick = ()=>{
  buildChat();
  showSheet('chatSheet');
  const box = document.getElementById('chatIn');
  if(box && window.matchMedia('(min-width:600px)').matches) box.focus();
};

boot();
</script>
