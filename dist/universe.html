 * Standalone: it borrows the palette and the embedded typefaces from the
 * fantasy app but not css/base.css, which resets <body> into a centred phone
 * frame. This is a desk tool, not a phone mock — it wants the whole window.
 *
 * The layout is a fixed header and a scrolling pane. Entry is the landing tab
 * because that is what you open the page to do: type in a card after playing.
 */
:root{
  --bg:#070A0F;--card:#111826;--card-2:#0E1420;--card-3:#0A101A;
  --line:#1E2836;--line-soft:#161E2A;
  --ink:#F3F6FA;--ink-2:#93A0B0;--ink-3:#5E6B7C;
  --green:#8CE04A;--red:#F0453E;--violet:#7C5CFF;--violet-soft:#2A2350;
  --gold:#E8B23A;--blue:#3B9BE8;
  --raw:#C8102E;--smackdown:#0B7BD5;--nxt:#F5C518;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
  font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}

/* ---------------------------------------------------------------- header */
.top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:var(--card-2);flex:none}
.brandmark{font-family:'Oswald','Barlow Condensed',system-ui,sans-serif;font-weight:700;
  font-size:19px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brandmark em{font-style:normal;color:var(--red)}
.top .meta{color:var(--ink-3);font-size:12px;letter-spacing:.04em;white-space:nowrap}
.top .spacer{flex:1}
.asof{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.asof input{background:var(--card-3);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;font-size:12px;color-scheme:dark}
.asof button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11px;
  text-decoration:underline;padding:2px}
.asof.past input{border-color:var(--gold);color:var(--gold)}

/* ---------------------------------------------------------------- tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line);
  background:var(--card-2);flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 15px;
  font-family:'Oswald','Barlow Condensed',system-ui,sans-serif;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .count{color:var(--ink-3);font-size:11px;margin-left:6px}

/* ---------------------------------------------------------------- panes */
.pane{flex:1;overflow-y:auto;padding:20px 22px 60px;display:none}
.pane.on{display:block}
.pane::-webkit-scrollbar{width:10px}
.pane::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

h2{font-family:'Oswald','Barlow Condensed',system-ui,sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
h2 .sub{color:var(--ink-3);letter-spacing:.02em;text-transform:none;font-size:12px;
  font-family:'Barlow',sans-serif;font-weight:400;margin-left:8px}
.grid{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(380px,1fr) minmax(380px,1.15fr);gap:18px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.flush{padding:0;overflow:hidden}

/* ---------------------------------------------------------------- entry */
.entry textarea{width:100%;min-height:210px;resize:vertical;background:var(--card-3);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;line-height:1.65;tab-size:2}
.entry textarea:focus{outline:0;border-color:var(--violet)}
.entry textarea::placeholder{color:var(--ink-3)}
details.entry summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:9px}
details.entry summary::-webkit-details-marker{display:none}
details.entry summary::before{content:'▸';color:var(--ink-3);font-size:11px}
details.entry[open] summary::before{content:'▾'}
details.entry summary h2{margin:0}
details.entry[open] summary{margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--violet);border:0;border-radius:8px;padding:9px 16px;font-weight:600;
  font-size:13px;color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--line);color:var(--red)}
.hint{color:var(--ink-3);font-size:12px}
kbd{background:var(--card-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-2)}

.syntax{color:var(--ink-3);font-size:12px;line-height:1.8;margin-top:12px;
  border-top:1px solid var(--line-soft);padding-top:11px}
.syntax code{font-family:ui-monospace,monospace;color:var(--ink-2);background:var(--card-3);
  border-radius:4px;padding:1px 5px}

/* problems and previews */
.msg{border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.msg.err{background:rgba(240,69,62,.09);border:1px solid rgba(240,69,62,.35);color:#FFB3B0}
.msg.warn{background:rgba(232,178,58,.08);border:1px solid rgba(232,178,58,.3);color:#F0D08A}
.msg.ok{background:rgba(140,224,74,.08);border:1px solid rgba(140,224,74,.3);color:#C6F09A}
.msg ul{margin:6px 0 0 16px}
.msg li{margin:2px 0}
.msg code{font-family:ui-monospace,monospace;opacity:.85}

/* ---------------------------------------------------------------- tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:'Oswald','Barlow Condensed',sans-serif;font-weight:500;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.022)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.dim{color:var(--ink-3)}
.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--ink-3)}
.wname{font-weight:600;cursor:pointer}
.wname:hover{color:var(--violet)}
.empty{color:var(--ink-3);padding:16px 2px;font-size:13px}

/* ---------------------------------------------------------------- chips */
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;
  letter-spacing:.03em;white-space:nowrap}
.chip.brand{background:var(--card-3);border:1px solid var(--line);color:var(--ink-2)}
.chip.title{background:rgba(232,178,58,.12);color:var(--gold);border:1px solid rgba(232,178,58,.3)}
.chip.up{background:rgba(140,224,74,.12);color:var(--green)}
.chip.down{background:rgba(240,69,62,.12);color:var(--red)}
.chip.fa{background:rgba(147,160,176,.1);color:var(--ink-2)}
.chip.hurt{background:rgba(240,69,62,.14);color:#FF9C97}
.chip.new{background:var(--violet);color:#fff}
.chip.group{background:var(--violet-soft);color:#B9A8FF}
.chip+.chip{margin-left:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* ---------------------------------------------------------------- brands */
.brandhead{display:flex;align-items:baseline;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--card-2)}
.brandhead .nm{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:16px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase}
.brandhead .ct{color:var(--ink-3);font-size:12px}
.brandhead .bar{width:4px;align-self:stretch;border-radius:2px}

/* ---------------------------------------------------------------- titles */
.belts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.belt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;padding:12px 14px;cursor:pointer}
.belt:hover{border-color:var(--line);background:var(--card-2)}
.belt .nm{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2)}
.belt .holder{font-size:17px;font-weight:600;margin:5px 0 6px}
.belt .holder.vacant{color:var(--ink-3);font-style:italic;font-weight:400}
.belt .facts{color:var(--ink-3);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}

.belt .interim{margin:-2px 0 6px;font-size:13px;color:var(--ink-2)}
.belt-link{cursor:pointer;font-weight:600}
.belt-link:hover{color:var(--gold)}

/* ---------------------------------------------------------------- detail pages */
.backrow{margin-bottom:12px}
.pagehead{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--violet);
  border-radius:10px;padding:14px 16px;margin-bottom:16px}
.pagehead .nm{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:26px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase}
.pagehead .holder{font-size:16px;margin-top:5px}
.pagehead .holder .vacant{color:var(--ink-3);font-style:italic}
.pagehead .dim{color:var(--ink-3);font-size:12px}

/* threads */
tr.stale td{background:rgba(232,178,58,.045)}
tr.stale td:first-child{box-shadow:inset 2px 0 0 var(--gold)}

/* ---------------------------------------------------------------- log */
.logrow td{font-size:13px}
.logrow.voided td{opacity:.42;text-decoration:line-through}
.logrow.voided td.act{opacity:1;text-decoration:none}
.act{white-space:nowrap;text-align:right}
.linkbtn{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:12px;
  text-decoration:underline;padding:2px 4px}
.linkbtn:hover{color:var(--ink)}
.linkbtn.warn:hover{color:var(--red)}

/* ---------------------------------------------------------------- sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,11,.72);display:none;z-index:100}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--card-2);
  border-left:1px solid var(--line);z-index:101;transform:translateX(102%);
  transition:transform .22s ease;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet .head h3{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:19px;font-weight:600;
  letter-spacing:.06em;flex:1}
.sheet .body{flex:1;overflow-y:auto;padding:16px 20px 40px}
.sheet .x{background:none;border:0;color:var(--ink-3);font-size:22px;cursor:pointer;line-height:1}
.sheet .x:hover{color:var(--ink)}
.facts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.fact{background:var(--card-3);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fact .k{color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.fact .v{font-size:16px;font-weight:600;margin-top:2px}

/* ---------------------------------------------------------------- season */
.opt{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.opt.inline{display:inline-flex;cursor:pointer;white-space:nowrap}
.opt.inline input[type=checkbox]{width:14px;height:14px;padding:0;accent-color:var(--violet);cursor:pointer}
.opt select,.opt input{background:var(--card-3);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-size:13px;color:var(--ink)}
.opt select:focus,.opt input:focus{outline:0;border-color:var(--violet)}

/* ---------------------------------------------------------------- prompts */
.promptrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.promptcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;cursor:pointer;color:var(--ink)}
.promptcard:hover{border-color:var(--ink-3)}
.promptcard.on{border-color:var(--violet);background:var(--violet-soft)}
.promptcard .nm{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase}
.promptcard .bl{color:var(--ink-3);font-size:12px;margin-top:4px}
#promptText{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.6}

/* ---------------------------------------------------------------- import */
.drop{border:2px dashed var(--line);border-radius:11px;padding:26px 18px;text-align:center;
  transition:border-color .15s,background .15s}
.drop.over{border-color:var(--violet);background:var(--violet-soft)}
.drop .big{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2)}
.shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.shot{width:120px;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--card-3)}
.shot.on{border-color:var(--violet)}
.shot img{width:100%;height:74px;object-fit:cover;display:block}
.shot figcaption{font-size:10px;color:var(--ink-3);padding:4px 6px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.keybox{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px}
.keybox summary{cursor:pointer;font-size:12px;color:var(--ink-3);list-style:none}
.keybox summary::-webkit-details-marker{display:none}
.keybox summary::before{content:'▸ ';color:var(--ink-3)}
.keybox[open] summary::before{content:'▾ '}
.keybox code{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-2)}
#shotText{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.6}
.chiplink{background:none;border:0;padding:0;cursor:pointer;font:inherit}
.chiplink:hover .chip{filter:brightness(1.2)}
.chiplink:hover .dim{color:var(--ink-2)}

/* ---------------------------------------------------------------- pyramid */
.pyramid{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:16px}
.rung{display:flex;align-items:stretch;gap:14px;width:100%;justify-content:center}
.rungmeta{align-self:center;text-align:right;min-width:120px}
.rungmeta .tiernum{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:13px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.rungmeta .tierlabel{color:var(--ink-3);font-size:11px}
.rungbrands{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.rungarrow{color:var(--ink-3);font-size:18px;line-height:1}
.brandcard{text-align:left;background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--bc);border-radius:11px;padding:11px 14px;min-width:210px;
  cursor:pointer;color:var(--ink)}
.brandcard:hover{border-color:var(--ink-3)}
.brandcard.on{border-color:var(--violet)}
.bhead{display:flex;align-items:baseline;gap:7px}
.blogo{font-size:15px}
.bname{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase}
.babbr{color:var(--ink-3);font-size:11px;letter-spacing:.08em}
.bfacts{display:flex;gap:11px;color:var(--ink-3);font-size:12px;margin-top:4px;flex-wrap:wrap}
.bmoves{display:flex;gap:11px;font-size:11px;margin-top:6px;flex-wrap:wrap}
.bmoves .up{color:var(--green)}
.bmoves .down{color:var(--red)}
.bparent{color:var(--ink-3);font-size:11px;margin-top:5px;font-style:italic}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px}
.opt.col{flex-direction:column;align-items:stretch;gap:4px}
.opt.col>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.opt.col em{font-style:normal;font-size:11px}
.opt input[type=color]{padding:2px;height:32px;width:100%;background:var(--card-3)}

/* ---------------------------------------------------------------- draft */
.draftgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.draftcol{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--bc);
  border-radius:11px;overflow:hidden}
.draftcol h3{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;padding:10px 13px;background:var(--card-2);border-bottom:1px solid var(--line)}
.draftcol h3 small{color:var(--ink-3);font-size:11px;letter-spacing:.02em;text-transform:none;margin-left:6px}
.draftcol ol{list-style:none;margin:0;padding:6px 0}
.draftcol li{display:flex;align-items:baseline;gap:8px;padding:4px 13px;font-size:13px}
.draftcol li .rd{color:var(--ink-3);font-size:11px;min-width:22px;font-variant-numeric:tabular-nums}
.draftcol li.protected{color:var(--gold)}
.draftcol li.team .nm::after{content:' ⛓';color:var(--ink-3);font-size:10px}
.draftcol li.moved .nm{font-weight:600}

/* ---------------------------------------------------------------- calendar */
.phases{display:flex;align-items:stretch;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.phase{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;opacity:.55}
.phase.done{opacity:.8;border-color:var(--line)}
.phase.on{opacity:1;border-color:var(--gold);background:var(--card-2)}
.phase .pname{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase}
.phase.on .pname{color:var(--gold)}
.phase .pwhen{color:var(--ink-3);font-size:11px;margin-top:2px}
.parrow{align-self:center;color:var(--ink-3);font-size:13px}

/* ---------------------------------------------------------------- brackets */
.bracketgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bracket{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bc);
  border-radius:10px;padding:10px 13px}
.bracket h3{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.07em;
  text-transform:uppercase}
.bracket h3 small{color:var(--ink-3);font-size:11px;letter-spacing:.02em;text-transform:none;margin-left:6px}
.bracket .bmeta{color:var(--ink-3);font-size:11px;margin-top:3px}
.bracket.relegation .bmeta{color:#E39A96}
.bracket.promotion .bmeta{color:#A8D98A}
.bracket ol{list-style:none;margin:8px 0 0;padding:0}
.bracket li{font-size:13px;padding:3px 0;border-top:1px solid var(--line-soft)}

/* ---------------------------------------------------------------- month grid */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead .calname{font-family:'Oswald','Barlow Condensed',sans-serif;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;min-width:190px}
.calhead .spacer{flex:1}
.calhead input[type=month]{background:var(--card-3);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;font-size:12px;color-scheme:dark}
.calcount{color:var(--ink-3);font-size:12px}

.cal{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.cdow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card-2);
  border-bottom:1px solid var(--line)}
.cdow div{padding:7px 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.cweek{display:grid;grid-template-columns:repeat(7,1fr)}
.cweek+.cweek{border-top:1px solid var(--line-soft)}
.cday{min-height:96px;padding:6px 7px;border-right:1px solid var(--line-soft);display:flex;
  flex-direction:column;gap:4px}
.cday:last-child{border-right:0}
.cday .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cday.out{background:var(--card-3)}
.cday.out .n{color:var(--ink-3);opacity:.5}
.cday.today{background:rgba(124,92,255,.07)}
.cday.today .n{color:var(--violet);font-weight:700}
.cday.ple{background:rgba(232,178,58,.06)}

.cshow{display:block;width:100%;text-align:left;background:var(--card-2);border:0;
  border-left:3px solid var(--bc);border-radius:5px;padding:4px 7px;cursor:pointer}
.cshow:hover{background:var(--card-3)}
.cshow .nm{display:block;font-size:12px;font-weight:600;line-height:1.25}
.cshow .ct{display:block;font-size:10px;color:var(--ink-3)}
.cday.ple .cshow{border-left-color:var(--gold)}

.cdue{display:inline-block;align-self:flex-start;font-size:10px;color:var(--ink-3);
  border-left:2px solid var(--bc);padding:1px 5px;background:var(--card-3);
  border-radius:0 4px 4px 0;margin-right:3px}

.chip.ple{background:rgba(232,178,58,.14);color:var(--gold);border:1px solid rgba(232,178,58,.3)}
.linkbtn.strong{color:var(--ink);font-weight:600;font-size:13px}
.beat{color:var(--ink-3);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:0 2px}
.segmeta{margin-top:2px;font-size:11px;color:var(--ink-3)}

</style>
</head>
<body>

<div class="top">
  <div class="brandmark"><em>Universe</em> Dashboard</div>

      abbr: $("#bfAbbr").value.trim() || void 0,
      logo: $("#bfLogo").value.trim() || void 0,
      color: $("#bfColor").value,
      // Not `Number(x) || 1` — that quietly turns a typed 0 into a valid tier 1
      // instead of refusing it, and the whole point of checkBrand is to say no.
      tier: $("#bfTier").value === "" ? 1 : Number($("#bfTier").value),
      day: $("#bfDay").value || void 0,
      parentId: $("#bfParent").value || void 0
    };
    const problems = checkBrand(app.state, rec, { id: id === "new" ? null : id });
    if (problems.length) {
      flash(problems.map(h).join("; "), "err");
      render();
      return;
    }
    try {
      if (id === "new") store.addEntity("brand", rec, { upsert: false });
      else store.amendEntity(id, rec, "edited from the dashboard");
      save();
      app.brandEdit = null;
      flash(`${h(rec.name)} saved. The pyramid, the lists and the draft all read it straight away.`);
    } catch (err2) {
      flash(h(err2.errors ? err2.errors.join("; ") : err2.message), "err");
    }
    render();
  });
  on("change", "#lsA", (e, el) => {
    app.pick = { aId: el.value, date: app.pick.date };
    render();
  });
  on("change", "#lsB", (e, el) => {
    app.pick = { ...app.pick, bId: el.value, winnerId: null };
    render();
  });
  on("change", "#lsWinner", (e, el) => {
    app.pick = { ...app.pick, winnerId: el.value };
    render();
  });
  on("change", "#lsDate", (e, el) => {
    app.pick = { ...app.pick, date: el.value };
  });
  on("click", "#lsClear", () => {
    app.pick = {};
    render();
  });
  on("click", "#lsRecord", () => {
    const { aId, bId, winnerId, date } = app.pick;
    try {
      const res = recordMatch(store, app.state, { aId, bId, winnerId, date: date || universeNow() });
      save();
      app.pick = { date };
      const moved = res.stakes ? `${h(app.state.wrestlers[res.stakes === "relegation" ? res.loserId : res.winnerId].name)} moves to ${h((app.state.brands[res.to] || {}).name || "")}` : "a qualifier \u2014 nobody moved, but the loser is out of the running";
      flash(`Recorded. ${moved}.`);
    } catch (err2) {
      flash(h(err2.errors ? err2.errors.join("; ") : err2.message), "err");
    }
    render();
  });
  on("click", "[data-draftpropose]", (e, el) => {
    app.season.draft = proposeDraft(app.state, { tier: Number(el.dataset.draftpropose) });
    app.season.proposal = null;
    app.season.lastStand = null;
    render();
  });
  on("click", "[data-draftcancel]", () => {
    app.season.draft = null;
    render();
  });
  on("click", "[data-draftcommit]", () => {
    const res = commitDraft(store, app.season.draft, { date: universeNow(), state: app.state });
    save();
    app.season.draft = null;
    flash(`Draft run \u2014 ${plural2(res.written, "wrestler")} changed brand.`);
    render();
  });
  var copyEntryPrompt = async (kind, statusEl) => {
    const ok = await copyText(entryPrompt(app.state, kind));
    const el = $(statusEl);
    if (el) el.textContent = ok ? "prompt copied \u2014 paste it into any AI, with a screenshot or a description" : "could not reach the clipboard";
    if (!el) flash(ok ? "Prompt copied \u2014 paste it into any AI, with a screenshot or a description." : "Could not reach the clipboard.", ok ? "ok" : "warn");
    if (!el) render();
  };
  on("click", "#cardPrompt", () => copyEntryPrompt("card", null));
  on("click", "#rosterPrompt", () => copyEntryPrompt("roster", null));
  on("click", "[data-titletoggle]", (e, el) => {
    const box = $("#cardText");
    if (!box) return;
    const lineNo = +el.dataset.titletoggle;
    const lines = box.value.split("\n");
    if (!lines[lineNo - 1]) return;
    lines[lineNo - 1] = setTitleOutcome(lines[lineNo - 1], el.dataset.want);
    box.value = lines.join("\n");
    refreshCardPreview();
  });
  function resolveNames(text) {
    const idx = buildIndex(store, "wrestler");
    const names = String(text || "").split(/\s*[&+,]\s*|\s+and\s+/i).map((s) => s.trim()).filter(Boolean);
    const ids = [], bad = [];
    names.forEach((n) => {
      const hit = resolve(idx, n);
      if (hit.ok) ids.push(hit.id);
      else bad.push(hit.reason === "ambiguous" ? `"${n}" matches ${hit.candidates.join(", ")}` : `no wrestler called "${n}"`);
    });
    return { ids, bad };
  }
  on("click", "[data-setchamp]", (e, el) => {
    const titleId = el.dataset.setchamp;
    const input = $("#champName");
    const { ids, bad } = resolveNames(input ? input.value : "");
    if (bad.length) {
      flash(bad.map(h).join("; "), "err");
      render();
      return;
    }
    if (!ids.length) {
      flash("Type a name first \u2014 or two names joined with &amp; for a tag title.", "warn");
      render();
      return;
    }
    store.append({
      type: "title.change",
      date: universeNow(),
      source: "dashboard",
      participants: ids.map((ref) => ({ ref, role: "champion" })),
      data: { titleId, reason: el.dataset.reason },
      note: "set from the dashboard"
    });
    save();
    flash(`${ids.map((i) => h(app.state.wrestlers[i].name)).join(" &amp; ")} is now the ${el.dataset.reason === "interim" ? "interim " : ""}champion.`);
    render();
  });
  on("click", "[data-vacate]", (e, el) => {
    store.append({
      type: "title.change",
      date: universeNow(),
      source: "dashboard",
      participants: [],
      data: { titleId: el.dataset.vacate, reason: "vacated" },
      note: "vacated from the dashboard"
    });
    save();
    flash("Title vacated. That opens a thread until somebody wins it.");
    render();
  });
  on("click", "#flagsPropose", () => {
    app.season.proposal = proposeFlags(app.state);
    app.season.lastStand = null;
    render();
  });
  on("click", "#flagsCancel", () => {
    app.season.proposal = null;
    render();
  });
  on("click", "#flagsCommit", () => {
    const res = commitFlags(store, app.season.proposal || [], { date: universeNow() });
    save();
    app.season.proposal = null;
    flash(`${plural2(res.written, "name")} flagged. Book Last Stand when you are ready.`);
    render();
  });
  on("click", "#lastStandPropose", () => {
    const proposal = proposeLastStand(app.state);
    if (!proposal.matches.length) {
      flash(proposal.resolved.length ? "Every competition has been settled \u2014 the draft is next." : "Nothing to book: nobody is carrying a flag.", "warn");
      render();
      return;
    }
    app.season.lastStandProposal = proposal;
    app.season.lastStand = lastStandCard(app.state, proposal, { date: universeNow() });
    app.season.draft = null;
    render();
  });
  on("click", "#lastStandCancel", () => {
    app.season.lastStand = null;
    app.season.lastStandProposal = null;
    render();
  });
  on("click", "#lastStandCopy", async () => {
    flash(await copyText(app.season.lastStand) ? "Card copied." : "Could not reach the clipboard.", "ok");
    render();
  });
  on("click", "#lastStandUse", () => {
    const text = app.season.lastStand;
    app.season.lastStand = null;
    app.season.lastStandProposal = null;
    go("tonight");
    $("#cardText").value = text;
    refreshCardPreview();
    $("#cardText").focus();
  });
  function refreshPrompt() {
    const box = $("#promptText");
    if (!box) return;
    const opts = {
      showId: app.prompt.showId || (app.state.shows.length ? app.state.shows[app.state.shows.length - 1].id : null),
      brandId: app.prompt.brandId || null,
      ple: app.prompt.ple || void 0
    };
    const text = buildPrompt(app.prompt.id, app.state, opts);
    box.value = text;
    $("#promptSize").textContent = `${text.length.toLocaleString()} characters`;
  }
  on("click", "[data-prompt]", (e, el) => {
    app.prompt = { ...app.prompt, id: el.dataset.prompt };
    render();
  });
  on("change", "#promptShow", (e, el) => {
    app.prompt.showId = el.value;
    refreshPrompt();
  });
  on("change", "#promptBrand", (e, el) => {
    app.prompt.brandId = el.value || null;
    refreshPrompt();
  });
  on("click", "#promptCopy", async () => {
    const ok = await copyText($("#promptText").value);
    $("#promptSize").textContent = ok ? "copied to clipboard" : "could not reach the clipboard \u2014 select the text and copy";
  });
  function refreshShotPreview() {
    const box = $("#shotText");
    if (!box) return;
    const text = cleanReply(box.value);
    app.shotText = box.value;
    const kind = detectKind(text) || app.shotKind;
    const out = kind === "roster" ? rosterPreview(store, app.state, text) : cardPreview(store, app.state, text);
    $("#shotPreview").innerHTML = out.html || "";
    $("#shotUse").disabled = !out.ok;
    app.shotParsed = out.ok ? { kind, text } : null;
    $("#shotStatus").textContent = text ? `reads as a ${kind === "roster" ? "roster" : "show card"}` : "";
  }
  var addShots = (files) => {
    [...files].filter((f) => /^image\//.test(f.type)).forEach((f) => {
      const r = new FileReader();
      r.onload = () => {
        app.shots.push({ name: f.name, dataUrl: r.result });
        app.activeShot = app.shots.length - 1;
        render();
      };
      r.readAsDataURL(f);
    });
  };
  on("click", "#shotPick", () => $("#shotFile").click());
  document.addEventListener("change", (e) => {
    if (e.target.id === "shotFile") addShots(e.target.files);
  });
  on("click", "[data-shot]", (e, el) => {
    app.activeShot = +el.dataset.shot;
    render();
  });
  on("change", "#shotKind", (e, el) => {
    app.shotKind = el.value;
  });
  document.addEventListener("dragover", (e) => {
    if (!$("#drop")) return;
    e.preventDefault();
    $("#drop").classList.add("over");
  });
  document.addEventListener("dragleave", (e) => {
    if ($("#drop") && e.target === $("#drop")) $("#drop").classList.remove("over");
  });
  document.addEventListener("drop", (e) => {
    if (!$("#drop")) return;
    e.preventDefault();
    $("#drop").classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files) addShots(e.dataTransfer.files);
  });
  on("click", "#shotPrompt", async () => {
    const ok = await copyText(transcriptionPrompt(app.state, app.shotKind));
    $("#shotStatus").textContent = ok ? "prompt copied \u2014 paste it into your AI along with the screenshot, then paste the reply below" : "could not reach the clipboard";
  });
  on("click", "#shotRead", async () => {
    const shot = app.shots[app.activeShot];
    if (!shot) return;
    const btn = $("#shotRead");
    btn.disabled = true;
    $("#shotStatus").textContent = "reading the screenshot\u2026";
    try {
      const out = await ingestScreenshot(app.state, { dataUrl: shot.dataUrl, kind: app.shotKind });
      $("#shotText").value = out.text;
      refreshShotPreview();
    } catch (err2) {
      $("#shotStatus").textContent = `could not read it: ${err2.message}`;
    }
    btn.disabled = false;
  });
  on("click", "#apiSave", () => {
    setKey($("#apiKey").value.trim());
    flash(hasKey() ? "Key saved in this browser. Screenshots will be read automatically." : "Key removed.");
    render();
  });
  on("click", "#apiClear", () => {
    setKey("");
    flash("Key removed.");
    render();
  });
  on("click", "#shotClear", () => {
    $("#shotText").value = "";
    app.shotText = "";
    refreshShotPreview();
  });
  on("click", "#shotUse", () => {
    if (!app.shotParsed) return;
    const { kind, text } = app.shotParsed;
    app.shotText = "";
    go(kind === "roster" ? "roster" : "tonight");
    if (kind === "roster") {
      $("#rosterPanel").open = true;
      $("#rosterText").value = text;
      refreshRosterPreview();
    } else {
      $("#cardText").value = text;
      refreshCardPreview();
      $("#cardText").focus();
    }
  });
  render();
  window.UNIVERSE = { store, app, render, project };
})();

</script>
</body>
</html>
